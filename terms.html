<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPlatform — Terms &amp; Conditions and Privacy Notice</title>
<!-- "Sky Tint" (docs/LOOK-DECISION.md): Spectral for headings and listing
     titles, Source Sans 3 for everything read as information. display=swap so
     a slow or blocked Google Fonts shows Georgia and the system sans rather
     than nothing - the page must never wait on a font to be readable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="auth-shell terms-shell">
  <div id="lang-toggle" class="lang-toggle lang-toggle-auth"></div>

  <div class="logo-row">
    <h1>MyPlatform</h1>
    <h2 id="terms-heading" class="logo-sub" data-i18n="terms.heading">Terms &amp; Conditions, Disclaimer and Privacy Notice</h2>
  </div>

  <div class="card">
    <p class="terms-placeholder-notice" id="terms-placeholder-notice" data-i18n="terms.placeholderNotice"></p>
    <p class="text-muted" id="terms-version"></p>
    <p id="terms-intro" data-i18n="terms.intro"></p>
    <div id="terms-body"></div>
    <p style="margin-top:22px;">
      <a href="#" id="terms-back" data-i18n="terms.back">Back</a>
    </p>
  </div>
</main>

<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/terms.js"></script>
</body>
</html>
