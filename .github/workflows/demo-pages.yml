name: Demo site

# Publishes the DEMO build (dist-demo/): the real screens on fake data, with no
# connection to Supabase. It is separate from ci.yml on purpose: ci.yml's deploy
# job publishes the real site behind the gate, and this workflow never touches it.
#
# The build refuses to finish if any real Supabase address or key is in the
# output (scripts/build-demo.js), and the browser tests check that the demo
# makes no request to Supabase (tests/demo). Both must pass before anything is
# published.
#
# PUBLISHING: the demo goes to its own Cloudflare Pages project,
# `myplatform-demo`, which is separate from the platform (`platform`) and the
# front page (`platform-www`). The publish job runs only on main, only after
# the build-and-test job passes, and fails when a Cloudflare secret is missing.
# It never touches GitHub Pages, which ci.yml's deploy job owns. Setup and the
# teardown are in HANDOFF.md ("Demo site on Cloudflare Pages").

on:
  # pull_request runs the demo's browser tests on every pull request, so they
  # gate the PR like the other checks. Nothing is published from here at all.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    name: Build and test the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the demo
        run: npm run build:demo
      - name: Install the browser for the demo tests
        run: npx playwright install --with-deps chromium
      - name: Demo tests (no Supabase requests, no real keys, every tab renders)
        run: npm run test:demo
      - name: Keep the demo build as a workflow artifact (not published)
        uses: actions/upload-pages-artifact@v5
        with:
          name: demo-site
          path: dist-demo

  # --------------------------------------------------------------------------
  # PUBLISH THE DEMO TO ITS OWN CLOUDFLARE PROJECT (myplatform-demo).
  #
  # Same rules as ci.yml's deploy-www: main only, no always() or other status
  # function, fail on a missing secret. It needs the build-and-test job, so
  # nothing publishes unless the demo's own browser tests passed. The project
  # must exist before the first run; see HANDOFF.md for the setup and teardown.
  # --------------------------------------------------------------------------
  publish-demo:
    name: Publish the demo to Cloudflare Pages
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-demo-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare publish cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the demo from this commit
        run: node scripts/build-demo.js
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-demo --project-name=myplatform-demo --branch=main --commit-hash=${{ github.sha }}
