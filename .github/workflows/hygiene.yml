name: Live database hygiene

# Asks once a day whether the live database is CLEAN. Nothing else asks.
#
# WHY THIS EXISTS
#
# The suites prove behaviour: a member can post, Browse names nobody, a
# deletion deletes. They do not look at the state of the owner's actual
# database, and they cannot - they run against fixtures they created and tore
# down. On 2026-10-12 every gate was green while his Notifications screen held
# 4,776 entries of which six were real, and it was the owner asking for another
# run, not any check, that found it. The same morning found 12,382 orphaned
# rows in the activity log.
#
# "The gate is green" and "your database is clean" are different claims. This
# is the second one, asked on a schedule so that nobody has to remember.
#
# It is read-only. scripts/verify-live.js only SELECTs and counts; it creates
# nothing, changes nothing, and cannot delete. Clearing what it reports is the
# Operator's own button, pressed by a person.

on:
  schedule:
    # 06:40 UTC. Off the hour deliberately: scheduled jobs pile up at :00 and
    # get delayed, and nothing here needs a punctual minute.
    - cron: '40 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

# WHY THIS WAITS BEFORE IT QUEUES (2026-10-30). GitHub keeps ONE waiting run per
# concurrency group, and a newer waiting run throws the older one out. The
# scheduled hygiene run joined the line behind a running checklist and threw
# out a manual checklist run that was already waiting. So hygiene no longer
# joins the line until the line is empty: the "wait" job polls (it holds no
# place in the line, so it can displace nobody), and only then does the real
# job take the slot. Still the same group as CI, for the same reason as before:
# its fixtures exist on purpose for those few minutes and would be reported as
# residue, which is how a useful check becomes one everybody learns to ignore.
# If the database is busy for 45 minutes the run FAILS and says so, rather than
# turning green without having looked.

jobs:
  wait:
    name: Wait until nothing else is using the database
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Poll until the live-database line is empty
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The workflows that share the group "ci-live-database".
          users='workflows/(ci|checklist-on-address|apply-sql|video|hygiene)[.]yml$'
          for i in $(seq 1 45); do
            busy=0
            for status in in_progress queued waiting; do
              n=$(gh api "repos/$REPO/actions/runs?status=$status&per_page=100" \
                  --jq "[.workflow_runs[] | select(.id != ($RUN_ID|tonumber)) | select(.path | test(\"$users\"))] | length")
              busy=$((busy + n))
            done
            if [ "$busy" -eq 0 ]; then echo "The line is empty (try $i)."; exit 0; fi
            echo "$busy run(s) are using or waiting for the live database (try $i of 45); waiting a minute."
            sleep 60
          done
          echo "::error::The live database was in use for 45 minutes, so hygiene did not run."
          exit 1

  hygiene:
    name: Is the live database clean
    needs: wait
    runs-on: ubuntu-latest
    concurrency:
      group: ci-live-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Count what should be zero
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/verify-live.js
