# TEMPORARY. One-off: re-takes the four sign-in (start) page pictures after the owner
# approved (2026-11-12) the shorter line under the sign-in box ("Access is by
# invitation only."). It runs on a push to this branch that changes this file, forces
# a full re-take of those four pictures only, fails before committing if anything
# else changed, and does nothing when they already match. Delete this file after use.
name: Re-take sign-in pictures (temporary)

on:
  push:
    branches: [signin-line-2026-11-12]
    paths: ['.github/workflows/retake-signin-pictures-now.yml']

permissions:
  contents: write

jobs:
  retake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signin-line-2026-11-12
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Re-take the four sign-in page pictures only
        run: npx playwright test -c playwright.visual.config.js tests/visual/pages.spec.js --update-snapshots=all -g "index \((en|es)\)"
      - name: Allow only the four sign-in page pictures to change
        id: check
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/index-en-desktop.png \
            tests/visual/screenshots/index-en-phone.png \
            tests/visual/screenshots/index-es-desktop.png \
            tests/visual/screenshots/index-es-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "Pictures already match. Nothing to commit."
            echo "pending=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in $changed; do
            if ! printf '%s\n' "$expected" | grep -qx "$f"; then echo "UNEXPECTED CHANGE: $f - nothing committed"; exit 1; fi
          done
          echo "pending=yes" >> "$GITHUB_OUTPUT"
      - name: Commit the changed pictures
        if: steps.check.outputs.pending == 'yes'
        run: |
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          git commit -m "Sign-in page pictures: the shorter line under the sign-in box (owner approved)"
          git push origin HEAD:signin-line-2026-11-12
