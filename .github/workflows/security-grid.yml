name: Security grid (staging)

# Knocks on every door of the database as every kind of caller, on the
# STAGING Supabase project, never the live one (scripts/security-grid.js
# refuses the live project outright). See the script's header for why: on
# Supabase the table grants are wide open by default and row-level security is
# the only lock, so the only honest test is to try every door.
#
# Staging is first brought up to the repository's SQL (apply-sql.js is safe
# to re-run), so the grid always tests the rules this commit would deploy.
# The nightly run also keeps the free staging project awake: Supabase pauses
# a free project after a week without use.
#
# The staging URL and publishable key are not secret; the service role key
# and database address are repository secrets.
#
# BEFORE 25 NOV 2026 the grid and the pictures also ran on pull requests, as jobs of ci.yml, behind the
# browser suites (so nothing else wrote to staging while the privilege scan counted rows, PR 117). The crowd
# scan ("Forty members at once", a speed test of the small staging server) was already nightly only
# (owner, 17 Nov 2026, docs/AGREED-2026-11-17-crowd-scan.md).
#
# SINCE 25 NOV 2026 (owner: "we first build and tweak and then you do stresstests, do it at night, not
# during my waking times"; docs/AGREED-2026-11-25-ci-step5.md) THIS IS THE ONE NIGHTLY RUN. The grid and the
# pictures no longer run on pull requests (they were jobs of ci.yml); the "Volume and concurrency" job
# (stress) moved here from ci.yml too. All three run here and nowhere else. This workflow is NOT part of the
# publishing gate: it is not run per push, so it cannot be a "needs" of the deploy jobs, and it must not be.
# A red night is a red run on the Actions page; each job keeps its log, and the stress job and the pictures
# also keep their files as artifacts. The supervisor reads it each morning and tells the owner in chat.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time on the one staging database.
concurrency:
  group: staging-database
  cancel-in-progress: false

env:
  SUPABASE_URL: https://pqxlfgvjoowawzgoszna.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Bring staging up to this commit's SQL
        run: node scripts/apply-sql.js --only-new
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

      - name: Every door, every caller
        run: node scripts/security-grid.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Same staging world, a different question: is any member ever SENT
      # another member's name, email, phone, company or ids - through any
      # table, any function, or any error message?
      - name: Nobody is sent anybody else's identity
        run: node scripts/identity-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # And: can anybody make themselves more than they are? Self-promotion,
      # forged tokens, Operator-only functions, the suspended acting active -
      # then the database is read past every policy to prove nothing moved.
      - name: Nobody rises above their station
        run: node scripts/privilege-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Secret codes and sessions: invitation codes cannot be guessed or
      # reused, signing out ends the refresh token, a member suspended or
      # deleted mid-session is shut out with the token they still hold, and
      # no token is ever stored where people read.
      - name: No code can be guessed, reused or kept
        run: node scripts/token-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Collisions: the same action by two hands at the same instant, fired
      # truly in parallel, then the database read to see what stuck.
      - name: Nothing happens twice that should happen once
        run: node scripts/collision-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Every email, by the real triggers, in English and Spanish: each one
      # matches its template in its reader's language, fully filled, linking
      # only to the platform, naming no poster.
      - name: Every email, both languages
        run: node scripts/email-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # The real pages, in a real browser, against staging: every page and
      # every dashboard tab as a stranger, a member and an Operator, in both
      # languages - no script errors, no dead tabs, nothing stuck loading, no
      # critical accessibility fault (axe-core). Two engines: Chromium and
      # Firefox (Safari's engine already runs in ci.yml).
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Every page, every tab (Chromium)
        run: node scripts/browser-crawl.js
        env:
          BROWSER: chromium
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Every page, every tab (Firefox)
        run: node scripts/browser-crawl.js
        env:
          BROWSER: firefox
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # What the real pages pull down and keep, as members A and B: every
      # download, localStorage, sessionStorage, cookies and the screen,
      # searched for another member's name, company, phone or email.
      - name: No member's browser gets another member's identity
        run: node scripts/browser-leak-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Last, so its 40 sign-ins come after the others' (staging allows 150
      # token requests per 5 minutes): 40 members acting at the same instant
      # through the real API. Every one answered, quickly, and stored once.
      - name: Forty members at once
        run: node scripts/crowd-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  # "Volume and concurrency", moved here from ci.yml on 25 Nov 2026. Needs no secrets and no staging: it runs
  # against a throwaway PostgreSQL the harness downloads, so it takes no turn in the staging line and runs
  # beside the grid. The three commands are exactly the ones ci.yml ran. Their output is kept in
  # nightly-evidence/ and uploaded when any of them fails.
  stress:
    name: Volume and concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Volume and concurrency
        # It found the rate-limit race on its first run: 24 parallel inserts all accepted against a limit
        # of 20, which no single-connection test could have seen.
        run: |
          mkdir -p nightly-evidence
          set -o pipefail
          npm run stress 2>&1 | tee nightly-evidence/stress.log
      - name: The five-open cap holds under two simultaneous submissions
        # Two submissions at the same moment, on two connections, 30 rounds: only this sees the race the
        # advisory lock in sql/054 prevents.
        run: |
          set -o pipefail
          npm run check:recommend-cap 2>&1 | tee nightly-evidence/recommend-cap.log
      - name: The email sender, made to fail on purpose
        run: |
          set -o pipefail
          npm run test:sender 2>&1 | tee nightly-evidence/sender.log
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-stress-evidence
          path: nightly-evidence/
          retention-days: 30
          if-no-files-found: ignore

  # The picture check (playwright.visual.config.js): the public pages and
  # every dashboard tab, against the approved pictures. A job of this
  # workflow, after the grid, and not a workflow of its own: two workflows
  # in the one staging-database line threw each other out (GitHub keeps one
  # waiting run per line), and the pictures were cancelled on PR 38.
  # A page with no approved picture fails, and its new picture is kept as
  # the "pictures" artifact to look at and commit.
  #
  # Since 25 Nov 2026 this workflow is the only place the pictures run, and it is never a pull request, so
  # the "layout" job below always says "true" (scripts/layout-changed.js stays for its own self-test and for
  # anyone who runs it by hand). A new English phrase can make a screen a few pixels different; the
  # pictures notice it here, the next night.
  layout:
    runs-on: ubuntu-latest
    outputs:
      pictures: ${{ steps.decide.outputs.pictures }}
    steps:
      - uses: actions/checkout@v5
      - name: Did anything that can move a picture change?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pictures=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the pictures always run."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF" HEAD > changed.txt
          echo "Changed files:"; cat changed.txt
          result=$(node scripts/layout-changed.js < changed.txt)
          echo "pictures=$result" >> "$GITHUB_OUTPUT"
          echo "The pictures run: $result"

  pictures:
    needs: [grid, layout]
    if: always() && needs.layout.outputs.pictures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Every page and every tab looks as approved
        run: npx playwright test -c playwright.visual.config.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Keep the pictures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pictures
          path: |
            test-results/
            tests/visual/screenshots/
          retention-days: 7
