name: Security grid (staging)

# Knocks on every door of the database as every kind of caller, on the
# STAGING Supabase project, never the live one (scripts/security-grid.js
# refuses the live project outright). See the script's header for why: on
# Supabase the table grants are wide open by default and row-level security is
# the only lock, so the only honest test is to try every door.
#
# Staging is first brought up to the repository's SQL (apply-sql.js is safe
# to re-run), so the grid always tests the rules this commit would deploy.
# The nightly run also keeps the free staging project awake: Supabase pauses
# a free project after a week without use.
#
# The staging URL and publishable key are not secret; the service role key
# and database address are repository secrets.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'sql/**'
      - 'scripts/security-grid.js'
      - 'scripts/*-scan.js'
      - 'scripts/browser-crawl.js'
      - '*.html'
      - 'js/**'
      - '.github/workflows/security-grid.yml'

permissions:
  contents: read

# One run at a time on the one staging database.
concurrency:
  group: staging-database
  cancel-in-progress: false

env:
  SUPABASE_URL: https://pqxlfgvjoowawzgoszna.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Bring staging up to this commit's SQL
        run: node scripts/apply-sql.js --only-new
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

      - name: Every door, every caller
        run: node scripts/security-grid.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Same staging world, a different question: is any member ever SENT
      # another member's name, email, phone, company or ids - through any
      # table, any function, or any error message?
      - name: Nobody is sent anybody else's identity
        run: node scripts/identity-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # And: can anybody make themselves more than they are? Self-promotion,
      # forged tokens, Operator-only functions, the suspended acting active -
      # then the database is read past every policy to prove nothing moved.
      - name: Nobody rises above their station
        run: node scripts/privilege-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Secret codes and sessions: invitation codes cannot be guessed or
      # reused, signing out ends the refresh token, a member suspended or
      # deleted mid-session is shut out with the token they still hold, and
      # no token is ever stored where people read.
      - name: No code can be guessed, reused or kept
        run: node scripts/token-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Collisions: the same action by two hands at the same instant, fired
      # truly in parallel, then the database read to see what stuck.
      - name: Nothing happens twice that should happen once
        run: node scripts/collision-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Every email, by the real triggers, in English and Spanish: each one
      # matches its template in its reader's language, fully filled, linking
      # only to the platform, naming no poster.
      - name: Every email, both languages
        run: node scripts/email-scan.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # The real pages, in a real browser, against staging: every page and
      # every dashboard tab as a stranger, a member and an Operator, in both
      # languages - no script errors, no dead tabs, nothing stuck loading, no
      # critical accessibility fault (axe-core). Two engines: Chromium and
      # Firefox (Safari's engine already runs in ci.yml).
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Every page, every tab (Chromium)
        run: node scripts/browser-crawl.js
        env:
          BROWSER: chromium
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Every page, every tab (Firefox)
        run: node scripts/browser-crawl.js
        env:
          BROWSER: firefox
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
