name: Demo Cloudflare project setup (manual)

# Runs ONLY when someone starts it by hand (workflow_dispatch). It proves the
# teardown for the demo's Cloudflare Pages project on a throwaway project,
# then creates the demo project. It publishes no site, and it never touches
# `platform` or `platform-www`: scripts/demo-cloudflare-setup.sh hard-codes
# the names and refuses anything else.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-demo-setup
  cancel-in-progress: false

jobs:
  setup:
    name: Prove the teardown, then create myplatform-demo
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Setup cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove the teardown, then create the demo project
        run: bash scripts/demo-cloudflare-setup.sh
