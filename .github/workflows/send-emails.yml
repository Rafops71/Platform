name: Listing Email Notifications

# Drives the 2026-08-26 requirement: every member gets emailed the full
# content of every new Sell Offer / Buy Request. sql/003_email_notifications.sql
# queues rows into public.email_outbox on every listing insert; this workflow
# just runs scripts/send-listing-emails.js to flush that queue.
#
# Requires repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     — same one used by apply-sql / verify-live
#   RESEND_API_KEY       — from https://resend.com/api-keys
#   LISTING_EMAIL_FROM    — a sender verified with Resend
#
# Until those secrets exist the job SKIPS rather than fails. It used to fail,
# and at every five minutes that was 288 failure notifications a day to the
# repository owner's inbox for a queue that had two rows in it, both from
# August. A missing secret is a configuration state, not an incident.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}

jobs:
  send-listing-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Are the secrets configured?
        id: secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LISTING_EMAIL_FROM: ${{ secrets.LISTING_EMAIL_FROM }}
        run: |
          missing=
          for name in SUPABASE_DB_URL RESEND_API_KEY LISTING_EMAIL_FROM; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped — no mail can be sent until these repository secrets are set:$missing (Settings > Secrets and variables > Actions)"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Flush the email queue
        if: steps.secrets.outputs.ready == 'yes'
        run: node scripts/send-listing-emails.js
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LISTING_EMAIL_FROM: ${{ secrets.LISTING_EMAIL_FROM }}
