name: Picture check

# The public pages and every tab of the member's and the Operator's
# dashboards (signed in on STAGING, data painted over), photographed and compared with the approved pictures in
# tests/visual/screenshots/ (playwright.visual.config.js says why). Always on
# this Ubuntu runner, so the references and the new pictures render alike.
#
# A page with no approved picture yet fails, and its picture is kept as the
# "pictures" artifact: look at it, and if it is right, commit it as the
# reference. The same artifact holds the expected/actual/diff images when a
# page has changed.

on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'tests/visual/**'
      - 'playwright.visual.config.js'
      - '.github/workflows/pictures.yml'

permissions:
  contents: read

# The dashboards sign in to staging: one run at a time on that database.
concurrency:
  group: staging-database
  cancel-in-progress: false

env:
  SUPABASE_URL: https://pqxlfgvjoowawzgoszna.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ

jobs:
  pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Every page and every tab looks as approved
        run: npx playwright test -c playwright.visual.config.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Keep the pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pictures
          path: |
            test-results/
            tests/visual/screenshots/
          retention-days: 7
