name: Record the films

# Makes the two explainer films. Manual only - this is a deliverable, not a
# gate, and nothing should be filming on a schedule.
#
# WHY HERE AND NOT IN A SESSION CONTAINER
#
# Three things have to be true in one place, and only a runner has all three.
# It needs a real ffmpeg: the one in a session container is Playwright's
# stripped build, which cannot read a WAV file at all. It needs Piper, which
# installs cleanly here. And it needs the live Supabase project, because the
# films are recorded against real throwaway fixtures rather than mock screens.
#
# WHAT IT PRODUCES
#
# One file per film per language, uploaded as an artifact. The owner downloads
# it; nothing is published anywhere by this workflow.

on:
  workflow_dispatch:
    inputs:
      film:
        description: 'Which film (member)'
        required: false
        default: 'member'
      lang:
        description: 'Language (en or es)'
        required: false
        default: 'en'
      voice:
        description: 'Voice, e.g. af_heart (Kokoro) or en_GB-cori-high (Piper). Blank uses script.json (Gemini Algieba).'
        required: false
        default: ''
      voice_run:
        description: 'Reuse the checked narration of an earlier run (its run id) instead of speaking the lines again'
        required: false
        default: ''
      engine:
        description: 'Voice engine: chatterbox (chosen by the owner on 2026-11-01), gemini, kokoro or piper'
        required: false
        default: 'chatterbox'
      commit:
        description: 'true = also commit the film to films/ on this branch (default: artifact only)'
        required: false
        default: ''
      stills:
        description: 'true = one still picture per scene (uploaded, nothing committed) instead of the film'
        required: false
        default: ''

permissions:
  # The film is committed back to the branch it was dispatched from, which
  # needs more than the default read-only token.
  contents: write

jobs:
  voice:
    # The narration, spoken and checked by ear (faster-whisper) in five parallel jobs, each with every fifth line.
    # Public repository: standard runners cost nothing, so parallel jobs cost nothing extra. These jobs touch no
    # database, so they do not take the live-database place that CI and the recording share.
    name: Voice ${{ matrix.shard }} of 5
    if: inputs.engine == 'chatterbox' && inputs.stills != 'true' && inputs.voice_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper
      - name: Speak my share of the lines, and listen to every one
        run: node video/make-narration.js --film ${{ inputs.film }} --lang ${{ inputs.lang }} --shard ${{ matrix.shard }}/5
        env:
          NARRATION_ENGINE: chatterbox
      - name: The voice check, line by line
        if: always()
        run: |
          echo "### Voice check, share ${{ matrix.shard }} of 5 (faster-whisper listens to every line)" >> "$GITHUB_STEP_SUMMARY"
          cat video/audio/wer-table-${{ matrix.shard }}.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ inputs.film }}-${{ inputs.lang }}-${{ matrix.shard }}
          path: |
            video/audio/*.wav
            video/audio/wer-table-*
          retention-days: 3
          if-no-files-found: warn

  record:
    name: Record and assemble
    needs: voice
    # Runs when the voice jobs all passed, or were not needed (stills, another engine). A failed line stops here.
    if: ${{ !cancelled() && (needs.voice.result == 'success' || needs.voice.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # The same group as CI: this creates and deletes fixtures on the live
      # project, and must never do that while the browser suites are mid-run.
      group: ci-live-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install ffmpeg, then prove it is really there
        # The runner image does NOT ship ffmpeg. Attempts three and four both
        # filmed all fourteen scenes and then died on the first ffmpeg call
        # with "command not found", while the check that was supposed to catch
        # exactly that reported success.
        #
        # It reported success because it was written as `ffmpeg -version |
        # head -1`, and a shell pipeline exits with the status of its LAST
        # command - head, which is perfectly happy. The check could not fail.
        # `command -v` below has nothing to hide behind.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1

      - run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        # Named explicitly rather than relying on whatever Python the runner
        # image happens to ship. Piper is the only Python in this project, and
        # a version that moves under us would break the narration silently -
        # the voices would simply fail to install and the film would be mute.
        with:
          python-version: '3.11'

      - name: Install the narration engine
        # Kokoro by default: 82M parameters, Apache-2.0, CPU only - no GPU
        # anywhere in this pipeline. Its model files are 325MB and 28MB, so
        # they are downloaded here rather than committed. Piper is still
        # installed alongside it, because video/script.json can select it and
        # it covers far more languages.
        run: |
          pip install kokoro-onnx soundfile piper-tts
          curl -sSL --retry 3 -o kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -sSL --retry 3 -o voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          # Proven present and the right size, not assumed: a truncated
          # download would otherwise fail later as an unreadable model.
          ls -l kokoro-v1.0.onnx voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 20000000
          python3 -m piper.download_voices ${{ inputs.voice || 'en_US-joe-medium es_ES-davefx-medium' }}

      - name: Fetch the checked narration from the voice jobs
        if: inputs.engine == 'chatterbox' && inputs.stills != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: voice-${{ inputs.film }}-${{ inputs.lang }}-*
          path: voice-parts
          run-id: ${{ inputs.voice_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Put the narration where the recorder looks
        if: inputs.engine == 'chatterbox' && inputs.stills != 'true'
        run: |
          mkdir -p video/audio
          find voice-parts -name '*.wav' -exec cp {} video/audio/ \;
          find voice-parts -name 'wer-table-*.md' | sort | xargs cat > video/audio/wer-table.md
          # The narration files are 32-bit float WAV; the assembler joins them with a 16-bit pause by plain
          # concatenation, which reads the pause at half its length (the Spanish film came out 19 s short).
          # Everything is made 16-bit first, so voice and pause have the same format.
          for f in video/audio/*.wav; do ffmpeg -v error -y -i "$f" -c:a pcm_s16le "$f.tmp.wav" && mv "$f.tmp.wav" "$f"; done
          ls video/audio | wc -l

      - name: Speak every line, and measure it
        run: node video/make-narration.js --film ${{ inputs.film }} --lang ${{ inputs.lang }} ${{ inputs.stills == 'true' && '--stills' || '' }}
        env:
          NARRATION_ENGINE: ${{ inputs.engine }}
          # The owner's Gemini key, a repository secret. It is read here and
          # nowhere else, and is in no file of the repository.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIPER_VOICE_DIR: ${{ github.workspace }}
          KOKORO_DIR: ${{ github.workspace }}
          # A voice named at dispatch overrides the scripted one, whichever
          # engine it belongs to. Empty is falsy in make-narration.js, which
          # then uses script.json's own choice.
          KOKORO_VOICE_EN: ${{ inputs.voice }}
          KOKORO_VOICE_ES: ${{ inputs.voice }}
          # Empty is falsy in make-narration.js, which then uses the default
          # for the language. Only the one matching --lang is ever read, so
          # setting both to the same name is harmless.
          PIPER_VOICE_EN: ${{ inputs.voice }}
          PIPER_VOICE_ES: ${{ inputs.voice }}

      - name: The voice check, line by line
        if: always() && inputs.engine == 'chatterbox' && inputs.stills != 'true'
        run: |
          echo "### Voice check (faster-whisper listens to every line)" >> "$GITHUB_STEP_SUMMARY"
          cat video/audio/wer-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"

      - name: Film it
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/serve.js &
          # Wait for the server with curl rather than npx wait-on: that package
          # is not a dependency of this project, so npx would fetch it from the
          # network on every run - a download in the middle of a recording job,
          # for something four lines of shell already do.
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/index.html >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/index.html >/dev/null || { echo "::error::the static server never answered"; exit 1; }
          node video/record.js --film ${{ inputs.film }} --lang ${{ inputs.lang }} ${{ inputs.stills == 'true' && '--stills' || '' }}

      - name: Join the voice to the picture
        if: inputs.stills != 'true'
        # ffmpeg is proved again HERE, in this step's own environment, rather
        # than trusting the earlier check. Attempt three failed on the first
        # ffmpeg call with an empty stderr - the signature of a binary that was
        # never started - and the earlier step had already said ffmpeg existed.
        # Two steps, two environments: this prints which one is telling the
        # truth instead of costing another run per guess.
        run: |
          echo "ffmpeg resolves to: $(command -v ffmpeg || echo NOT FOUND)"
          echo "ffprobe resolves to: $(command -v ffprobe || echo NOT FOUND)"
          ffmpeg -version | head -1 || true
          node video/assemble.js --film ${{ inputs.film }} --lang ${{ inputs.lang }}

      - name: Prove the film is actually a film
        if: inputs.stills != 'true'
        # video/check-film.js asks three questions: is there a picture, is
        # there a soundtrack, and does the length match the measured
        # narration. All three can be wrong on a run that finishes green.
        #
        # This was fifteen lines of shell with a hard-coded 60-to-120-second
        # window, and the moment the narration was slowed down - the moment
        # the film got BETTER - that gate failed it. The expected length is
        # now computed from audio/timings.json and script.json, so it cannot
        # go stale and nobody has to widen it. The same script runs in a
        # session container, which is where it was proven.
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of default=nw=1 \
            video/out/${{ inputs.film }}-${{ inputs.lang }}.mp4
          node video/check-film.js --film ${{ inputs.film }} --lang ${{ inputs.lang }}

      - name: Hand the film over through git
        if: inputs.stills != 'true' && inputs.commit == 'true'
        # The artifact is served from a host the authoring session cannot
        # reach, so the film is also committed to films/ on the branch this
        # run was dispatched from. Git is the one channel that works in both
        # directions, so the film can be checked by whoever asked for it
        # rather than only downloaded by hand from the Actions page.
        #
        # Committed onto THIS branch rather than a branch of its own: an
        # orphan branch keeps the whole working tree staged, so the obvious
        # four lines quietly commit the entire repository alongside the film.
        run: |
          f=video/out/${{ inputs.film }}-${{ inputs.lang }}.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p films
          cp "$f" "films/${{ inputs.film }}-${{ inputs.lang }}.mp4"
          # The measurements the film was checked against travel WITH it.
          # Without them video/check-film.js re-checks a film against whatever
          # narration happens to be lying around, and a film made with a
          # slower voice then fails a check that proves nothing: that happened
          # on 2026-10-17, comparing am_michael's film to af_heart's timings.
          cp video/audio/timings.json "films/${{ inputs.film }}-${{ inputs.lang }}.timings.json"
          git add -f "films/${{ inputs.film }}-${{ inputs.lang }}.mp4" \
                     "films/${{ inputs.film }}-${{ inputs.lang }}.timings.json"
          git diff --cached --quiet && { echo "the film is byte-identical to the one already there"; exit 0; }
          git commit -m "${{ inputs.film }}-${{ inputs.lang }}.mp4, from run ${{ github.run_id }}"

          # Rebase and retry, because the branch moves under a run that takes
          # eight minutes. A push from this job was rejected as non-fast-forward
          # on 2026-10-18 for exactly that reason: the branch was pushed to
          # while the film was being made, and a finished, verified film was
          # thrown away at the last step. The film is the expensive part; the
          # push is not, and it should bend rather than break.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - fetching and rebasing (attempt $attempt)"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }} || {
              # A conflict here can only be two runs writing the same film.
              # Theirs is as good as ours and arrived first; keep ours, since
              # this one is the film that was just verified.
              git checkout --ours "films/${{ inputs.film }}-${{ inputs.lang }}.mp4" || true
              git checkout --ours "films/${{ inputs.film }}-${{ inputs.lang }}.timings.json" || true
              git add -A && git rebase --continue || git rebase --abort
            }
            sleep 5
          done
          echo "::error::could not push the film after three attempts"
          exit 1

      - name: Here is the film
        if: inputs.stills != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: myplatform-${{ inputs.film }}-${{ inputs.lang }}
          path: video/out/*.mp4
          retention-days: 30
          if-no-files-found: error

      - name: Here is the voice check
        if: always() && inputs.engine == 'chatterbox' && inputs.stills != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: myplatform-${{ inputs.film }}-${{ inputs.lang }}-voicecheck
          path: video/audio/wer-table.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Here are the stills
        if: inputs.stills == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: myplatform-${{ inputs.film }}-${{ inputs.lang }}-stills
          path: video/stills/*.png
          retention-days: 14
          if-no-files-found: error

      - name: What went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-failure-${{ inputs.film }}-${{ inputs.lang }}
          path: |
            video/out/
            video/audio/timings.json
          retention-days: 5
          if-no-files-found: ignore
