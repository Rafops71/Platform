name: CI

# The gate. Nothing is published unless every function on docs/CHECKLIST.md has
# a passing test, so a crossed function blocks the build rather than producing
# an artifact nobody checked.
#
# Two suites, deliberately split by what they need:
#
#   database  — sql/tests, run against a real PostgreSQL that embedded-postgres
#               downloads here. Needs no secrets, so it also runs on forks.
#   checklist — the @checklist browser group, run against the live Supabase
#               project because Supabase Auth is cloud-hosted and has no local
#               stand-in. Needs secrets, so it cannot run on a fork's PR.
#
# The package job depends on both. That dependency is the gate; removing it
# removes the point of this file.

on:
  # A branch push and that branch's pull request are the same commit, so
  # running both doubles the load on the one live database for no extra
  # coverage. Pushes are gated on main; branches are gated through their PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # The checklist suite writes to the shared live Supabase project, and its
  # teardown removes every myplatform-e2e- account it can see. Two runs at once
  # therefore delete each other's fixtures mid-test: the signed-in account
  # disappears and sign-in stops redirecting, listings vanish and their
  # foreign keys fail, match counts come back zero. That is exactly what
  # happened on 2026-10-11, when three runs overlapped between 15:43 and
  # 15:52 and eleven unrelated tests failed.
  #
  # The group deliberately has NO ${{ github.ref }} in it. The previous
  # version did, which looked like a guard but was not one: a push run is
  # refs/heads/x and a pull_request run is refs/pull/N/merge, so they landed
  # in different groups and ran side by side.
  #
  # cancel-in-progress is false: a run that is already talking to the
  # database should finish and clean up after itself, not be killed halfway
  # and leave its accounts behind. Later runs queue instead.
  #
  # PULL REQUESTS RUN THEIR BROWSER SUITES ON STAGING (docs/AGREED-2026-11-16-tooling.md,
  # item 4), so they no longer hold the live lane: a pull request's run queues in its own group,
  # "ci-staging-database", and a push to main (or a manual run) keeps "ci-live-database", the
  # group apply-sql.yml shares. The group is deliberately NOT security-grid.yml's
  # "staging-database": two workflows in one group cancel each other's waiting runs (that is
  # what happened to the pictures on PR 38). Everything that touches staging in a pull request
  # is a job of THIS workflow, in a chain (checklist, then safari: see "needs" below).
  # Since 25 Nov 2026 the security grid, the pictures and the volume and concurrency tests (stress) are
  # NOT here: they run only in security-grid.yml, the one nightly run (docs/AGREED-2026-11-25-ci-step5.md),
  # so nothing in a pull request or a push waits for them and nothing at night waits for a pull request.
  group: ${{ github.event_name == 'pull_request' && 'ci-staging-database' || 'ci-live-database' }}
  cancel-in-progress: false

jobs:
  # Does this pull request change anything the long browser chain (Function checklist, Safari) could
  # notice? (docs/ROADMAP-2026-11-22.md section 0.6, step 2; scripts/browser-suites-needed.js has the rule and its
  # self-test.) A pull request that changes ONLY documents says "false" and skips that chain; anything else, wording
  # in js/i18n.js included, says "true". A push to main and a manual run ALWAYS say "true": that run is what gates
  # publishing, so it never skips. This job runs on every event and always succeeds, and the database job and the
  # offline checks always run, so a documents-only pull request still has them.
  changes:
    name: Which suites does this change need?
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.decide.outputs.browser }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Documents only?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: every suite always runs (this is the run that gates publishing)."
            exit 0
          fi
          # HEAD is GitHub's merge of the pull request into its base; its first parent is the base, so this is
          # exactly what the pull request changes.
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "Changed files:"; cat changed.txt
          result=$(node scripts/browser-suites-needed.js < changed.txt)
          echo "browser=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "false" ]; then
            echo "Documents only: the browser suites (Function checklist, Safari) are skipped on this pull request. The database tests and the offline checks still run, and a push to main runs everything."
          else
            echo "The browser suites run."
          fi

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Needs no secrets and no browser, so it runs here rather than in the
      # checklist job: a loader written without its stale-render guard should
      # fail in seconds, on forks too, not after an eight-minute browser suite.
      - name: Stale-render guards
        run: npm run check:guards
      # The suite below applies scripts/pg-harness.js's list. If that differs
      # from what a deployment applies, every assertion can pass against a
      # database nobody runs - which is exactly what happened on 2026-10-12,
      # when five migrations were tested and never deployed.
      - name: Migration lists agree
        run: npm run check:migrations
      # js/reset.js called initLanguage(), a function that has never existed.
      # It parsed cleanly and threw on load in the browser, so the recovery
      # page never checked the link and never said the link was bad. Two CI
      # runs were spent on the symptom.
      - name: Every call resolves
        run: npm run check:calls
      # A branch written before the rename to MyPlatform still called
      # jericho.rpc(...) after it merged: no conflict, parsed cleanly, and
      # check:calls does not look at method calls. The Operator page died on load.
      - name: The database is reached only through the declared client
        run: npm run check:client
      # A phrase missing from Spanish does not crash: it shows English to
      # somebody who does not read English, on a screen nobody who built it
      # ever looks at.
      - name: Both languages agree
        run: npm run check:i18n
      # Seven actions created rows with nothing stopping a second press. On a
      # phone a double tap is not a mistake anybody notices making.
      - name: No action can be started twice
        run: npm run check:double
      # Captured live: a refused action answered "new row violates row-level
      # security policy for table \"listings\"". A member was shown that.
      - name: Members never see the database's own words
        run: npm run check:errors
      # Proven live: a comma typed into the Operator's region box became
      # another condition on the query.
      - name: Typed text is never query syntax
        run: npm run check:filters
      # Proven from GitHub's own timestamps: until 2026-10-25 the site went
      # live twelve minutes before the checklist finished. The deploy job below
      # fixes that, and this keeps it fixed - one always() would undo it.
      # An acceptance records the hash of the text in terms_versions. If the
      # page's wording drifts from that copy, members sign one text while the
      # record holds another.
      - name: The Terms members read are the Terms the database holds
        run: npm run check:terms
      - name: The site is published only after every check passes
        run: npm run check:deploy
      # A browser test written against an element the page hides when it loads
      # can never pass (docs/FABLE-ORCHESTRATION-2026-11-16.md, fix 6). Found
      # here in a second, with the self-tests of the three tooling scripts
      # added the same day: migration numbers, applied-live probes, picture filter.
      - name: No test asserts on a hidden element
        run: npm run check:test-hidden
      - name: Tooling self-tests
        run: |
          node scripts/check-test-hidden.js --self-test
          node scripts/check-migration-lists.js --self-test
          node scripts/check-applied-live.js --self-test
          node scripts/layout-changed.js --self-test
          node scripts/live-smoke.js --self-test
          node scripts/browser-suites-needed.js --self-test
          node scripts/superseded-runs.js --self-test
          node scripts/check-cancel-workflow.js
          node scripts/check-cancel-workflow.js --self-test
      - name: Run sql/tests
        run: npm run test:sql
      # The one-off tool that makes the standing Operator on STAGING (manual workflow, nothing runs on
      # merge) proves itself here: its guard refuses the live project, its workflow names only staging
      # secrets, and create / teardown work for real against a throwaway PostgreSQL.
      - name: The staging Operator tool works and refuses live
        run: node scripts/staging-operator.js --self-test
      # Pull requests run the browser suites on STAGING, pushes to main on LIVE, and the staging jobs
      # take turns. This reads this very file and fails if that rule could ever send a push to staging,
      # a pull request to live, hand a publishing job a database secret, or bring the grid, the pictures or
      # stress back into this workflow; its self-test breaks a copy several ways and needs a failure each time.
      - name: Pull requests use staging, pushes to main use live, staging jobs take turns
        run: |
          npm run check:ci-targets
          node scripts/check-ci-targets.js --self-test

  safari:
    name: Safari on an iPhone
    runs-on: ubuntu-latest
    # WHICH DATABASE THE BROWSER SUITES USE (docs/AGREED-2026-11-16-tooling.md, item 4). One rule: a
    # pull request uses the STAGING project, everything else (push to main, manual run) uses LIVE.
    # Declared on the two jobs that run browser suites, and only on them, so no other job (the
    # publishing ones included) is handed these secrets. scripts/check-ci-targets.js fails the build
    # if either block differs from the rule or a browser-suite step names a live secret directly.
    # The staging URL and publishable key are public, as in security-grid.yml.
    env:
      TARGET_URL: ${{ github.event_name == 'pull_request' && 'https://pqxlfgvjoowawzgoszna.supabase.co' || secrets.SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ github.event_name == 'pull_request' && 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ' || secrets.SUPABASE_ANON_KEY }}
      TARGET_SERVICE_ROLE_KEY: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_DB_URL: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL }}
    # AFTER the checklist, never beside it. Both drive the live Supabase
    # project, and two live runs at once is a race nobody needs: the fixtures
    # are scoped per run, but an orphan sweep in one can land mid-test in the
    # other. The cost is a few minutes at the end of a run that is already
    # thirteen.
    needs: checklist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Cache the Playwright browser download
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install WebKit
        # WebKit, not Chromium: this job exists precisely because every other
        # suite runs on Chrome's engine, and on iOS every browser is WebKit
        # underneath - Chrome on an iPhone included.
        run: npx playwright install --with-deps webkit

      - name: The member's journey on Safari
        # Same target rule as the checklist (see TARGET_* above): staging on a pull request, live otherwise.
        env:
          SUPABASE_URL: ${{ env.TARGET_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.TARGET_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TARGET_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ env.TARGET_DB_URL }}
          SERVE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && env.TARGET_URL || '' }}
          SERVE_SUPABASE_KEY: ${{ github.event_name == 'pull_request' && env.TARGET_ANON_KEY || '' }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: npx playwright test --project=safari

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: safari-failure
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore

  checklist:
    name: Function checklist
    needs: changes
    # Skipped only on a pull request that changes documents alone (see the "changes" job); always runs otherwise.
    if: ${{ needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    # WHICH DATABASE THE BROWSER SUITES USE (docs/AGREED-2026-11-16-tooling.md, item 4). One rule: a
    # pull request uses the STAGING project, everything else (push to main, manual run) uses LIVE.
    # Declared on the two jobs that run browser suites, and only on them, so no other job (the
    # publishing ones included) is handed these secrets. scripts/check-ci-targets.js fails the build
    # if either block differs from the rule or a browser-suite step names a live secret directly.
    # The staging URL and publishable key are public, as in security-grid.yml.
    env:
      TARGET_URL: ${{ github.event_name == 'pull_request' && 'https://pqxlfgvjoowawzgoszna.supabase.co' || secrets.SUPABASE_URL }}
      TARGET_ANON_KEY: ${{ github.event_name == 'pull_request' && 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ' || secrets.SUPABASE_ANON_KEY }}
      TARGET_SERVICE_ROLE_KEY: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_DB_URL: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Confirm the secrets this suite needs are present
        # Without this the suite fails deep inside a fixture with an unhelpful
        # auth error. Say plainly which secret is missing instead.
        # Checks the values this run will actually use: the staging ones on a pull request,
        # the live ones otherwise (TARGET_* above), and says which.
        env:
          SUPABASE_URL: ${{ env.TARGET_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TARGET_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ env.TARGET_DB_URL }}
          SUPABASE_ANON_KEY: ${{ env.TARGET_ANON_KEY }}
          WHICH: ${{ github.event_name == 'pull_request' && 'STAGING (pull request)' || 'LIVE (push to main or manual run)' }}
        run: |
          echo "This run's browser suites use: $WHICH"
          missing=
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s) for $WHICH:$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret (staging ones are named STAGING_...)"
            exit 1
          fi
          echo "All four values are present."

      - name: Is every new migration applied live?
        # Seconds, before the 15-minute browser suite (docs/FABLE-ORCHESTRATION-2026-11-16.md,
        # fix 3). The suite runs against the LIVE project, so a pull request that adds a
        # migration is red until it is applied there; this says so at once, by name,
        # instead of after the browser run. Each new migration carries a read-only
        # "-- applied-probe:" line, asked inside a READ ONLY transaction
        # (scripts/check-applied-live.js). On a push to main there is nothing to compare.
        env:
          BASE_REF: ${{ github.base_ref }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/check-applied-live.js

      - name: Bring staging up to this commit's SQL
        # Pull requests only. The suite below runs on staging, so staging must hold this commit's
        # migrations first. --only-new skips what the staging ledger already records and applies the
        # rest, one transaction per file. A push to main runs on live, which the supervisor has
        # already brought up (the probe step above checks it).
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: node scripts/apply-sql.js --only-new

      - name: Cache the Playwright browser download
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Tick/cross table
        # scripts/serve.js is started by playwright.config.js — nothing to start
        # here. Exits non-zero if any function is crossed or unproven.
        #
        # WHICH DATABASE: staging on a pull request, live on a push to main or a manual run
        # (TARGET_* at the top of this job). SERVE_* make the test server hand the pages the
        # same project, since js/supabase-config.js names live; they are empty on a push.
        env:
          SUPABASE_URL: ${{ env.TARGET_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.TARGET_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.TARGET_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ env.TARGET_DB_URL }}
          SERVE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && env.TARGET_URL || '' }}
          SERVE_SUPABASE_KEY: ${{ github.event_name == 'pull_request' && env.TARGET_ANON_KEY || '' }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
          # How many spec files run at once (docs/AGREED-2026-11-23-ci-speed.md, PR 2). Pull requests run on staging with 2.
          # A push to main (live, the run that gates publishing) stays at 1 until the pull-request runs have shown the
          # parallel suite stable over several runs; then this is the one line to change. With more than 1, the files in
          # tests/e2e/exclusive-specs.js run alone after the others (scripts/checklist-report.js).
          E2E_WORKERS: ${{ github.event_name == 'pull_request' && '2' || '1' }}
        run: npm run checklist

      # Printed on success, not only on failure. The timings are most useful
      # exactly when nothing is broken: they are what next month's run gets
      # compared against. Before this they were written into
      # checklist-results.json and thrown away on every green run.
      - name: What the volume tests measured
        if: success()
        run: npm run timings || true

      - name: Why it failed
        # The table says which function is crossed; it does not say why. The
        # error itself sits in checklist-results.json, which only ever left
        # here as a zipped artifact — and an artifact is no use to anyone
        # reading the log, which is where a failure is actually read. Print
        # the real error, with its file and line, into the log instead.
        if: failure()
        run: npm run why || true

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: checklist-failure
          # Traces and screenshots from a failed run can contain session tokens
          # and test-account contents. Short retention, and never committed.
          path: |
            checklist-results.json
            test-results/
          retention-days: 5
          if-no-files-found: ignore

  package:
    name: Build artifact
    needs: [database, checklist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package the site
        # Reached only when both suites are green. A crossed function means this
        # job never runs and no artifact exists to deploy. The same script the
        # deploy job below uses, so the artifact is what would be published.
        run: ./scripts/assemble-site.sh dist
      - uses: actions/upload-artifact@v6
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 14

  # --------------------------------------------------------------------------
  # PUBLISH THE SITE - and only here.
  #
  # Until 2026-10-25 GitHub Pages published main straight from the branch, on
  # its own, independently of everything above. Proven from GitHub's own check
  # runs on commit 556e185: `deploy` finished 14:42:43, `Function checklist`
  # finished 14:55:03. Members had the new version twelve minutes before the
  # gate said whether it worked. A red run would have changed nothing they saw.
  #
  # This job is now the only way the site is published (Settings > Pages >
  # Source must be "GitHub Actions" for it to take effect). It cannot run until
  # every check has passed, because GitHub's documented rule for `needs` is:
  #
  #   "If a job fails or is skipped, all jobs that need it are skipped"
  #
  # unless the job uses always(). THIS JOB MUST NEVER USE always(), or a
  # status function that ignores failure, in its `if:`. That one word would
  # turn the gate back into an alarm.
  #
  # Safari is in the list deliberately: it was not in `package`'s, and a
  # change that breaks the iPhone layout is a broken release.
  #
  # main only. A branch run reaches this job and is skipped, which is the
  # evidence, on the branch, that the wiring holds.
  # --------------------------------------------------------------------------
  deploy:
    name: Publish the site
    needs: [database, checklist, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # Assembled again here, from this run's own commit, rather than handed
      # down from `package`: a re-run of this job alone then still publishes
      # exactly the commit that passed, without depending on how GitHub treats
      # artifacts across re-run attempts - which its documentation does not say.
      - name: Assemble exactly what the site serves
        run: ./scripts/assemble-site.sh dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Say which version is live
        run: |
          echo "Published revision ${{ github.sha }} to ${{ steps.deployment.outputs.page_url }}"
          echo "Check it from anywhere: ${{ steps.deployment.outputs.page_url }}REVISION"

  # --------------------------------------------------------------------------
  # PUBLISH TO CLOUDFLARE PAGES - the same gate, a second destination.
  #
  # Migration plan: HANDOFF.md, "Migration to Cloudflare Pages". GitHub Pages
  # above stays the live site until the checklist has passed on the new
  # address, so this job ADDS a copy; it replaces nothing.
  #
  # Same `needs` and same main-only `if:` as `deploy`, and the same rule: no
  # always() or other status function here, ever. It is NOT a second way round
  # the gate, because it cannot start until every check has passed.
  #
  # A missing secret FAILS this job; it never skips and goes green (the lesson
  # of send-emails.yml, and a second-opinion finding on PR 42). The failure
  # touches only this job: `deploy` above publishes to GitHub Pages on its own.
  # --------------------------------------------------------------------------
  deploy-cloudflare:
    name: Publish to Cloudflare Pages
    needs: [database, checklist, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare publish cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - name: Assemble exactly what the site serves
        run: ./scripts/assemble-site.sh dist
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=platform --branch=main --commit-hash=${{ github.sha }}

  # --------------------------------------------------------------------------
  # PUBLISH THE FRONT PAGE (www/) TO ITS OWN CLOUDFLARE PROJECT.
  #
  # www.myplatform.trade is a separate project (`platform-www`) from the app,
  # so the app never serves the front page and the front page never serves the
  # app. Same gate, same main-only rule, same fail-on-missing-secret rule as
  # `deploy-cloudflare`: no always() here, ever.
  # --------------------------------------------------------------------------
  deploy-www:
    name: Publish the front page to Cloudflare Pages
    needs: [database, checklist, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-www-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare publish cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy www --project-name=platform-www --branch=main --commit-hash=${{ github.sha }}

  # --------------------------------------------------------------------------
  # A SHORT LOOK AT THE LIVE SITE AFTER EVERY PUBLISH (docs/AGREED-2026-11-25-ci-step5.md).
  #
  # Not part of the gate: it runs AFTER the two Cloudflare publishes, so it can never stop one, and no
  # publishing job waits for it. It reads the public site with a few GET requests (scripts/live-smoke.js:
  # REVISION is this commit, the app, sign-in and register pages answer, the front page shows its
  # headline) and creates no data anywhere. It waits up to three minutes for Cloudflare to serve the new
  # commit. A red result here means the site just published is not what a visitor receives.
  # --------------------------------------------------------------------------
  smoke:
    name: Live site answers after the publish
    needs: [deploy-cloudflare, deploy-www]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The live site serves this commit and its pages answer
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          WAIT_SECONDS: '180'
        run: node scripts/live-smoke.js
