name: CI

# The gate. Nothing is published unless every function on docs/CHECKLIST.md has
# a passing test, so a crossed function blocks the build rather than producing
# an artifact nobody checked.
#
# Two suites, deliberately split by what they need:
#
#   database  — sql/tests, run against a real PostgreSQL that embedded-postgres
#               downloads here. Needs no secrets, so it also runs on forks.
#   checklist — the @checklist browser group, run against the live Supabase
#               project because Supabase Auth is cloud-hosted and has no local
#               stand-in. Needs secrets, so it cannot run on a fork's PR.
#
# The package job depends on both. That dependency is the gate; removing it
# removes the point of this file.

on:
  # A branch push and that branch's pull request are the same commit, so
  # running both doubles the load on the one live database for no extra
  # coverage. Pushes are gated on main; branches are gated through their PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  # The checklist suite writes to the shared live Supabase project, and its
  # teardown removes every jericho-e2e- account it can see. Two runs at once
  # therefore delete each other's fixtures mid-test: the signed-in account
  # disappears and sign-in stops redirecting, listings vanish and their
  # foreign keys fail, match counts come back zero. That is exactly what
  # happened on 2026-10-11, when three runs overlapped between 15:43 and
  # 15:52 and eleven unrelated tests failed.
  #
  # The group deliberately has NO ${{ github.ref }} in it. The previous
  # version did, which looked like a guard but was not one: a push run is
  # refs/heads/x and a pull_request run is refs/pull/N/merge, so they landed
  # in different groups and ran side by side.
  #
  # cancel-in-progress is false: a run that is already talking to the
  # database should finish and clean up after itself, not be killed halfway
  # and leave its accounts behind. Later runs queue instead.
  group: ci-live-database
  cancel-in-progress: false

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Needs no secrets and no browser, so it runs here rather than in the
      # checklist job: a loader written without its stale-render guard should
      # fail in seconds, on forks too, not after an eight-minute browser suite.
      - name: Stale-render guards
        run: npm run check:guards
      # The suite below applies scripts/pg-harness.js's list. If that differs
      # from what a deployment applies, every assertion can pass against a
      # database nobody runs - which is exactly what happened on 2026-10-12,
      # when five migrations were tested and never deployed.
      - name: Migration lists agree
        run: npm run check:migrations
      # js/reset.js called initLanguage(), a function that has never existed.
      # It parsed cleanly and threw on load in the browser, so the recovery
      # page never checked the link and never said the link was bad. Two CI
      # runs were spent on the symptom.
      - name: Every call resolves
        run: npm run check:calls
      # A phrase missing from Spanish does not crash: it shows English to
      # somebody who does not read English, on a screen nobody who built it
      # ever looks at.
      - name: Both languages agree
        run: npm run check:i18n
      # Seven actions created rows with nothing stopping a second press. On a
      # phone a double tap is not a mistake anybody notices making.
      - name: No action can be started twice
        run: npm run check:double
      # Captured live: a refused action answered "new row violates row-level
      # security policy for table \"listings\"". A member was shown that.
      - name: Members never see the database's own words
        run: npm run check:errors
      # Proven live: a comma typed into the Operator's region box became
      # another condition on the query.
      - name: Typed text is never query syntax
        run: npm run check:filters
      # Proven from GitHub's own timestamps: until 2026-10-25 the site went
      # live twelve minutes before the checklist finished. The deploy job below
      # fixes that, and this keeps it fixed - one always() would undo it.
      # An acceptance records the hash of the text in terms_versions. If the
      # page's wording drifts from that copy, members sign one text while the
      # record holds another.
      - name: The Terms members read are the Terms the database holds
        run: npm run check:terms
      - name: The site is published only after every check passes
        run: npm run check:deploy
      - name: Run sql/tests
        run: npm run test:sql

  stress:
    name: Volume and concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Volume and concurrency
        # Runs against a throwaway PostgreSQL the harness downloads and starts,
        # so it needs no secrets and nothing to clean up afterwards. It found
        # the rate-limit race on its first run: 24 parallel inserts all
        # accepted against a limit of 20, which no single-connection test could
        # have seen.
        run: npm run stress
      - name: The email sender, made to fail on purpose
        # Lost answers, provider errors, refusals and two senders at once,
        # against a fake provider: every email goes out once or is given up.
        run: npm run test:sender

  safari:
    name: Safari on an iPhone
    runs-on: ubuntu-latest
    # AFTER the checklist, never beside it. Both drive the live Supabase
    # project, and two live runs at once is a race nobody needs: the fixtures
    # are scoped per run, but an orphan sweep in one can land mid-test in the
    # other. The cost is a few minutes at the end of a run that is already
    # thirteen.
    needs: checklist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install WebKit
        # WebKit, not Chromium: this job exists precisely because every other
        # suite runs on Chrome's engine, and on iOS every browser is WebKit
        # underneath - Chrome on an iPhone included.
        run: npx playwright install --with-deps webkit

      - name: The member's journey on Safari
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: npx playwright test --project=safari

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-failure
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore

  checklist:
    name: Function checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Confirm the secrets this suite needs are present
        # Without this the suite fails deep inside a fixture with an unhelpful
        # auth error. Say plainly which secret is missing instead.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "All four secrets are present."

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Tick/cross table
        # scripts/serve.js is started by playwright.config.js — nothing to start
        # here. Exits non-zero if any function is crossed or unproven.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
        run: npm run checklist

      # Printed on success, not only on failure. The timings are most useful
      # exactly when nothing is broken: they are what next month's run gets
      # compared against. Before this they were written into
      # checklist-results.json and thrown away on every green run.
      - name: What the volume tests measured
        if: success()
        run: npm run timings || true

      - name: Why it failed
        # The table says which function is crossed; it does not say why. The
        # error itself sits in checklist-results.json, which only ever left
        # here as a zipped artifact — and an artifact is no use to anyone
        # reading the log, which is where a failure is actually read. Print
        # the real error, with its file and line, into the log instead.
        if: failure()
        run: npm run why || true

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-failure
          # Traces and screenshots from a failed run can contain session tokens
          # and test-account contents. Short retention, and never committed.
          path: |
            checklist-results.json
            test-results/
          retention-days: 5
          if-no-files-found: ignore

  package:
    name: Build artifact
    needs: [database, checklist, stress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the site
        # Reached only when both suites are green. A crossed function means this
        # job never runs and no artifact exists to deploy. The same script the
        # deploy job below uses, so the artifact is what would be published.
        run: ./scripts/assemble-site.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 14

  # --------------------------------------------------------------------------
  # PUBLISH THE SITE - and only here.
  #
  # Until 2026-10-25 GitHub Pages published main straight from the branch, on
  # its own, independently of everything above. Proven from GitHub's own check
  # runs on commit 556e185: `deploy` finished 14:42:43, `Function checklist`
  # finished 14:55:03. Members had the new version twelve minutes before the
  # gate said whether it worked. A red run would have changed nothing they saw.
  #
  # This job is now the only way the site is published (Settings > Pages >
  # Source must be "GitHub Actions" for it to take effect). It cannot run until
  # every check has passed, because GitHub's documented rule for `needs` is:
  #
  #   "If a job fails or is skipped, all jobs that need it are skipped"
  #
  # unless the job uses always(). THIS JOB MUST NEVER USE always(), or a
  # status function that ignores failure, in its `if:`. That one word would
  # turn the gate back into an alarm.
  #
  # Safari is in the list deliberately: it was not in `package`'s, and a
  # change that breaks the iPhone layout is a broken release.
  #
  # main only. A branch run reaches this job and is skipped, which is the
  # evidence, on the branch, that the wiring holds.
  # --------------------------------------------------------------------------
  deploy:
    name: Publish the site
    needs: [database, checklist, stress, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Assembled again here, from this run's own commit, rather than handed
      # down from `package`: a re-run of this job alone then still publishes
      # exactly the commit that passed, without depending on how GitHub treats
      # artifacts across re-run attempts - which its documentation does not say.
      - name: Assemble exactly what the site serves
        run: ./scripts/assemble-site.sh dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Say which version is live
        run: |
          echo "Published revision ${{ github.sha }} to ${{ steps.deployment.outputs.page_url }}"
          echo "Check it from anywhere: ${{ steps.deployment.outputs.page_url }}REVISION"

  # --------------------------------------------------------------------------
  # PUBLISH TO CLOUDFLARE PAGES - the same gate, a second destination.
  #
  # Migration plan: HANDOFF.md, "Migration to Cloudflare Pages". GitHub Pages
  # above stays the live site until the checklist has passed on the new
  # address, so this job ADDS a copy; it replaces nothing.
  #
  # Same `needs` and same main-only `if:` as `deploy`, and the same rule: no
  # always() or other status function here, ever. It is NOT a second way round
  # the gate, because it cannot start until every check has passed.
  #
  # A missing secret FAILS this job; it never skips and goes green (the lesson
  # of send-emails.yml, and a second-opinion finding on PR 42). The failure
  # touches only this job: `deploy` above publishes to GitHub Pages on its own.
  # --------------------------------------------------------------------------
  deploy-cloudflare:
    name: Publish to Cloudflare Pages
    needs: [database, checklist, stress, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare publish cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - name: Assemble exactly what the site serves
        run: ./scripts/assemble-site.sh dist
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=platform --branch=main --commit-hash=${{ github.sha }}

  # --------------------------------------------------------------------------
  # PUBLISH THE FRONT PAGE (www/) TO ITS OWN CLOUDFLARE PROJECT.
  #
  # www.myplatform.trade is a separate project (`platform-www`) from the app,
  # so the app never serves the front page and the front page never serves the
  # app. Same gate, same main-only rule, same fail-on-missing-secret rule as
  # `deploy-cloudflare`: no always() here, ever.
  # --------------------------------------------------------------------------
  deploy-www:
    name: Publish the front page to Cloudflare Pages
    needs: [database, checklist, stress, safari, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-www-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Are the secrets configured?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare publish cannot run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi
      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy www --project-name=platform-www --branch=main --commit-hash=${{ github.sha }}
