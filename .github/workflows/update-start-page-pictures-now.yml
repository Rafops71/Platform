# TEMPORARY. One-off: regenerates the four start-page pictures after the owner
# approved the new look (only the "Help and questions" link removed). Manual
# dispatch only. It changes nothing except those four PNGs, and fails before
# committing if anything else changed. Delete this file after use.
name: Update start-page pictures (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-2026-11-08
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Update the four start-page pictures only
        run: npx playwright test -c playwright.visual.config.js tests/visual/pages.spec.js --update-snapshots -g "index \((en|es)\)"
      - name: Allow only the four start-page pictures to change
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/index-en-desktop.png \
            tests/visual/screenshots/index-en-phone.png \
            tests/visual/screenshots/index-es-desktop.png \
            tests/visual/screenshots/index-es-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ "$changed" != "$expected" ]; then echo "UNEXPECTED CHANGES - nothing committed"; exit 1; fi
      - name: Commit the four pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/screenshots/index-en-desktop.png tests/visual/screenshots/index-en-phone.png tests/visual/screenshots/index-es-desktop.png tests/visual/screenshots/index-es-phone.png
          git commit -m "Start page pictures: Help link removed (owner approved)"
          git push origin HEAD:batch-2026-11-08
