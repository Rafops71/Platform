# TEMPORARY. One-off: re-takes the four start-page pictures after the owner
# approved (2026-11-09) that the browser's loading circle over the film goes.
# The test (tests/visual/pages.spec.js) now resets the film's controls so the
# circle is never in the shot. It runs on a push to this branch that changes
# this file. It changes nothing except those four PNGs, fails before committing
# if anything else changed, and does nothing when they already match.
# Delete this file after use.
name: Re-take start-page pictures (temporary)

on:
  push:
    branches: [batch-2026-11-08]
    paths: ['.github/workflows/update-start-page-pictures-now.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batch-2026-11-08
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Update the four start-page pictures only
        run: npx playwright test -c playwright.visual.config.js tests/visual/pages.spec.js --update-snapshots -g "index \((en|es)\)"
      - name: Allow only the four start-page pictures to change
        id: check
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/index-en-desktop.png \
            tests/visual/screenshots/index-en-phone.png \
            tests/visual/screenshots/index-es-desktop.png \
            tests/visual/screenshots/index-es-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "Pictures already match. Nothing to commit."
            echo "pending=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changed" != "$expected" ]; then echo "UNEXPECTED CHANGES - nothing committed"; exit 1; fi
          echo "pending=yes" >> "$GITHUB_OUTPUT"
      - name: Commit the four pictures
        if: steps.check.outputs.pending == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/screenshots/index-en-desktop.png tests/visual/screenshots/index-en-phone.png tests/visual/screenshots/index-es-desktop.png tests/visual/screenshots/index-es-phone.png
          git commit -m "Start page pictures: loading circle over the film gone (owner approved)"
          git push origin HEAD:batch-2026-11-08
