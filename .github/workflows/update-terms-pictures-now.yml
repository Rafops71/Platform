# TEMPORARY. One-off: regenerates the four Terms pictures after Terms 3.8's text changed on
# purpose (owner-approved: "the Operator" in the singular, one new sentence in section 8, one
# contact address). Runs only when this file is pushed to terms-3-8-2026-11-16. It changes nothing
# except tests/visual/screenshots/terms-{en,es}-{desktop,phone}.png, and fails before committing
# if anything else changed. Removed in the next, normal commit.
name: Update Terms pictures (temporary)

on:
  push:
    branches: [terms-3-8-2026-11-16]
    paths: ['.github/workflows/update-terms-pictures-now.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Update the four Terms pictures only
        run: npx playwright test -c playwright.visual.config.js tests/visual/pages.spec.js --update-snapshots -g "terms \((en|es)\)"
      - name: Allow only the four Terms pictures to change
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/terms-en-desktop.png \
            tests/visual/screenshots/terms-en-phone.png \
            tests/visual/screenshots/terms-es-desktop.png \
            tests/visual/screenshots/terms-es-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ "$changed" != "$expected" ]; then echo "UNEXPECTED CHANGES - nothing committed"; exit 1; fi
      - name: Commit the four pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/screenshots/terms-en-desktop.png tests/visual/screenshots/terms-en-phone.png tests/visual/screenshots/terms-es-desktop.png tests/visual/screenshots/terms-es-phone.png
          git commit -m "Terms pictures: regenerated after the approved Terms 3.8 text changed"
          git push origin HEAD:terms-3-8-2026-11-16
