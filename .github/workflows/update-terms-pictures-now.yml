# TEMPORARY. One-off: regenerates the four Terms pictures after the Terms text
# changed on purpose (clause 17 added, the candidates paragraph, the Operator
# wording, 17 sections). Runs only when this file itself is pushed. It changes
# nothing except tests/visual/screenshots/terms-{en,es}-{desktop,phone}.png,
# and fails before committing if anything else changed. Delete this file after
# use (a separate, normal commit).
name: Update Terms pictures (temporary)

on:
  push:
    branches: [terms-3-6-final]
    paths: ['.github/workflows/update-terms-pictures-now.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Update the four Terms pictures only
        run: npx playwright test -c playwright.visual.config.js tests/visual/pages.spec.js --update-snapshots -g "terms \((en|es)\)"
      - name: Allow only the four Terms pictures to change
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/terms-en-desktop.png \
            tests/visual/screenshots/terms-en-phone.png \
            tests/visual/screenshots/terms-es-desktop.png \
            tests/visual/screenshots/terms-es-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ "$changed" != "$expected" ]; then echo "UNEXPECTED CHANGES - nothing committed"; exit 1; fi
      - name: Commit the four pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/screenshots/terms-en-desktop.png tests/visual/screenshots/terms-en-phone.png tests/visual/screenshots/terms-es-desktop.png tests/visual/screenshots/terms-es-phone.png
          git commit -m "Terms pictures: regenerated after the approved Terms text changed"
          git push origin HEAD:terms-3-6-final
