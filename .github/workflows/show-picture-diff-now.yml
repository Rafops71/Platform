# TEMPORARY. One-off: shows the supervisor HOW the Operator Invitations tab picture
# differs from its approved one (desktop and phone) now that it has a
# Recommendations list. It runs the Operator dashboard picture test as the
# pictures job does (no update), and commits the ACTUAL, EXPECTED and DIFF
# images of the Invitations tab only to tmp-visual-diff/. It never touches an
# approved picture. Runs on a push to this branch that changes this file.
# Delete this file and tmp-visual-diff/ after use.
name: Show picture difference (temporary)

on:
  push:
    branches: [t7-recommend-2026-11-08]
    paths: ['.github/workflows/show-picture-diff-now.yml']

permissions:
  contents: write

# The same Staging address and public key the pictures job uses (security-grid.yml).
env:
  SUPABASE_URL: https://pqxlfgvjoowawzgoszna.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t7-recommend-2026-11-08
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Run the Operator dashboard picture test as CI does (no update)
        run: npx playwright test -c playwright.visual.config.js tests/visual/dashboards.spec.js -g "operator.html" || true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Collect the Invitations tab images only
        run: |
          mkdir -p tmp-visual-diff
          echo "every failing tab picture in this run:"
          find test-results -name '*-actual.png' | sort
          for f in $(find test-results -name 'operator-invitations-*-actual.png' -o -name 'operator-invitations-*-expected.png' -o -name 'operator-invitations-*-diff.png' | sort); do
            d=$(basename "$(dirname "$f")")
            case "$d" in *phone*) p=phone;; *) p=desktop;; esac
            cp "$f" "tmp-visual-diff/operator-invitations-${p}__$(basename "$f" | sed 's/^operator-invitations-//')"
          done
          ls -l tmp-visual-diff
      - name: Commit only tmp-visual-diff
        run: |
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort -u)
          echo "changed:"; echo "$changed"
          if [ "$changed" != "tmp-visual-diff/" ]; then echo "UNEXPECTED CHANGES - nothing committed"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-visual-diff
          git commit -m "Temporary: actual, expected and diff images for the Operator Invitations tab"
          git push origin HEAD:t7-recommend-2026-11-08
