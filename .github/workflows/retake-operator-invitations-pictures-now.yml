# TEMPORARY. One-off: re-takes the two Operator Invitations tab pictures (desktop
# and phone) after the owner approved (2026-11-09) the new 'Candidate
# recommendations' card at the top of that tab. steady.css now also keeps that
# table's rows out of the picture. Only pictures beyond tolerance are rewritten
# (--update-snapshots=changed); it fails before committing if anything other than
# those two files changed. Runs on a push to this branch that changes this
# file. Delete this file after use.
name: Re-take Operator Invitations pictures (temporary)

on:
  push:
    branches: [t7-recommend-2026-11-08]
    paths: ['.github/workflows/retake-operator-invitations-pictures-now.yml']

permissions:
  contents: write

# The same Staging address and public key the pictures job uses (security-grid.yml).
env:
  SUPABASE_URL: https://pqxlfgvjoowawzgoszna.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxeGxmZ3Zqb293YXd6Z29zem5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTUyNTMsImV4cCI6MjEwODY5MTI1M30.d-5Hk6gljO5IOgsLus3AtddsOD7g9xJ6ra4beHGFtEQ

jobs:
  retake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t7-recommend-2026-11-08
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Re-take the Operator dashboard pictures that differ
        run: npx playwright test -c playwright.visual.config.js tests/visual/dashboards.spec.js -g "operator.html" --update-snapshots=changed
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Allow only the two Invitations pictures to change
        id: check
        run: |
          expected=$(printf '%s\n' \
            tests/visual/screenshots/operator-invitations-desktop.png \
            tests/visual/screenshots/operator-invitations-phone.png | sort)
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          echo "changed:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "Pictures already match. Nothing to commit."
            echo "pending=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for f in $changed; do
            if ! printf '%s\n' "$expected" | grep -qx "$f"; then echo "UNEXPECTED CHANGE: $f - nothing committed"; exit 1; fi
          done
          echo "pending=yes" >> "$GITHUB_OUTPUT"
      - name: Commit the changed pictures
        if: steps.check.outputs.pending == 'yes'
        run: |
          changed=$(git status --porcelain -- . ':!test-results' | awk '{print $2}' | sort)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          git commit -m "Operator Invitations pictures: Candidate recommendations card (owner approved)"
          git push origin HEAD:t7-recommend-2026-11-08
