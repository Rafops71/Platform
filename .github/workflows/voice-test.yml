name: Voice test (VoxCPM2 and Kokoro)

# Two short test clips from two free, Apache-2.0 voice models, made on GitHub's
# own free runners, for the owner to listen to and pick (owner's list, item 22,
# 2026-11-01). Manual only. No secrets, no live database, nothing committed:
# the clips are uploaded as artifacts and the summary says what ran.
#
# Kokoro is small and very likely runs on a CPU. VoxCPM2's model card names
# CUDA >= 12.0 as a requirement and says nothing about CPU, so that job is
# allowed to fail (continue-on-error) and says plainly what happened.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one job (kokoro, voxcpm, gemini, chatterbox, qwen, trailer, speed) or all'
        default: 'all'

permissions:
  contents: read

jobs:
  kokoro:
    if: ${{ inputs.only == 'all' || inputs.only == 'kokoro' || github.event_name != 'workflow_dispatch' }}
    name: Kokoro-82M (English and Spanish voices)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the system library Kokoro needs
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Install Kokoro (CPU build of PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.2" soundfile
      - name: Make the clips
        run: python video/voice-test/kokoro_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Kokoro-82M" >> "$GITHUB_STEP_SUMMARY"
          cat clips/kokoro-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-kokoro
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  voxcpm:
    if: ${{ inputs.only == 'all' || inputs.only == 'voxcpm' || github.event_name != 'workflow_dispatch' }}
    name: VoxCPM2 (English and Spanish clips, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VoxCPM2 (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm soundfile
      - name: Try to make the clips
        run: python video/voice-test/voxcpm_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### VoxCPM2" >> "$GITHUB_STEP_SUMMARY"
          cat clips/voxcpm-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-voxcpm
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  gemini:
    if: ${{ inputs.only == 'all' || inputs.only == 'gemini' || github.event_name != 'workflow_dispatch' }}
    name: Gemini Algieba (the same two lines, for comparison; may fail on the free daily limit)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make the two lines with the film voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p clips
          python3 - <<'PY'
          import json, subprocess
          g = json.load(open('video/script.json'))['voice']['gemini']
          lines = {
            'en': 'A private market for physical commodities. By invitation only.',
            'es': 'Un mercado privado de materias primas físicas. Solo por invitación.',
          }
          for lang, text in lines.items():
              r = subprocess.run(['python3', 'video/gemini_say.py', g['model'], g['voice'], g['style'][lang], f'clips/gemini-{lang}.wav'],
                                 input=text, text=True, capture_output=True)
              print(lang, 'ok' if r.returncode == 0 else 'FAILED: ' + (r.stderr or '')[-200:])
          PY
      - name: Say what happened
        if: always()
        run: |
          echo "### Gemini (Algieba)" >> "$GITHUB_STEP_SUMMARY"
          ls -l clips >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-gemini
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  chatterbox:
    if: ${{ inputs.only == 'all' || inputs.only == 'chatterbox' || github.event_name != 'workflow_dispatch' }}
    name: Chatterbox-Multilingual (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Try to make the clips
        run: python video/voice-test/chatterbox_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Chatterbox" >> "$GITHUB_STEP_SUMMARY"
          cat clips/chatterbox-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-chatterbox
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  qwen:
    if: ${{ inputs.only == 'all' || inputs.only == 'qwen' }}
    name: Qwen3-TTS 0.6B (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen3-TTS (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -U qwen-tts soundfile
      - name: Try to make the clips
        run: python video/voice-test/qwen_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Qwen3-TTS" >> "$GITHUB_STEP_SUMMARY"
          cat clips/qwen-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-qwen
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  trailer:
    if: ${{ inputs.only == 'trailer' }}
    name: Trailer voice lines with Chatterbox (English and Spanish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper
      - name: Speak the twelve trailer lines
        run: |
          mkdir -p clips
          python video/chatterbox_say.py video/trailer/voice-lines.json clips/wer-table.md
      - name: The voice check, line by line
        if: always()
        run: |
          echo "### Voice check (faster-whisper listens to every line)" >> "$GITHUB_STEP_SUMMARY"
          cat clips/wer-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-voice-chatterbox
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  speed_en:
    # Pace samples (owner's request 2026-11-02): one approved line in Gemini "Algieba" at three paces set by the
    # style prompt (no time-stretching), 3 requests in all. The real words per minute are measured, not assumed.
    if: ${{ inputs.only == 'speed' }}
    name: Pace samples, English (Gemini Algieba, 3 requests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Speak the line three times
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p clips
          TEXT="All communication passes through the Operator. Introduction follows only once both sides agree on the essential terms and wish to proceed."
          MODEL=$(python3 -c "import json;print(json.load(open('video/script.json'))['voice']['gemini']['model'])")
          for wpm in 120 130 140; do
            STYLE="Confident, warm, polished narrator for a premium private trading platform. Calm, measured delivery at about $wpm words per minute, with natural pauses between sentences. Do not rush."
            echo "$TEXT" | python3 video/gemini_say.py "$MODEL" Algieba "$STYLE" clips/gemini-target-$wpm.wav || echo "FAILED at target $wpm" >> clips/speed-summary.txt
          done
      - name: Measure the real pace
        if: always()
        run: |
          words=21
          echo "| target wpm | seconds (whole file) | seconds (speech only) | measured wpm (speech only) |" > clips/speed-summary.md
          echo "|---|---|---|---|" >> clips/speed-summary.md
          for f in clips/gemini-target-*.wav; do
            [ -f "$f" ] || continue
            t=$(basename "$f" .wav | sed 's/gemini-target-//')
            whole=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            ffmpeg -v error -y -i "$f" -af "silenceremove=start_periods=1:start_threshold=-45dB:stop_periods=-1:stop_duration=0.6:stop_threshold=-45dB" /tmp/trim.wav
            trimmed=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/trim.wav)
            python3 -c "w=$whole;t=$trimmed;print(f'| $t | {w:.1f} | {t:.1f} | {$words/t*60:.0f} |')" >> clips/speed-summary.md
            ffmpeg -v error -y -i "$f" -ac 1 -b:a 48k "clips/gemini-target-$t.mp3"
          done
          cat clips/speed-summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          cat clips/speed-summary.txt 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-samples-en
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  speed_es:
    # One Spanish pace sample with Chatterbox through the Whisper gate. NOT for the owner to listen to; the pace and
    # the WER are only reported. The Spanish wording is a plain translation of the approved English line, for timing.
    if: ${{ inputs.only == 'speed' }}
    name: Pace sample, Spanish (Chatterbox, gated)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper
      - name: Speak the line, listen to it, measure it
        run: |
          mkdir -p clips
          python3 - <<'PY'
          import json
          t = "Toda la comunicación pasa por el Operador. La presentación se produce solo cuando ambas partes acuerdan los términos esenciales y desean continuar."
          json.dump([dict(id='speed-es', text=t, lang='es', out='clips/chatterbox-es-speed.wav')], open('clips/jobs.json', 'w'), ensure_ascii=False)
          PY
          python video/chatterbox_say.py clips/jobs.json clips/wer-table.md
          words=$(python3 -c "import json;print(len(json.load(open('clips/jobs.json'))[0]['text'].split()))")
          ffmpeg -v error -y -i clips/chatterbox-es-speed.wav -af "silenceremove=start_periods=1:start_threshold=-45dB:stop_periods=-1:stop_duration=0.6:stop_threshold=-45dB" /tmp/trim.wav
          t=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/trim.wav)
          python3 -c "print(f'Spanish Chatterbox: $words words, {float($t):.1f} s of speech = {$words/float($t)*60:.0f} wpm')" | tee clips/speed-es-summary.txt
          cat clips/speed-es-summary.txt clips/wer-table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-sample-es-chatterbox
          path: clips/
          retention-days: 7
          if-no-files-found: warn
