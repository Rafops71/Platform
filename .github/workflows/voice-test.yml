      - name: Install Qwen3-TTS (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -U qwen-tts soundfile
      - name: Try to make the clips
        run: python video/voice-test/qwen_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Qwen3-TTS" >> "$GITHUB_STEP_SUMMARY"
          cat clips/qwen-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-qwen
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  trailer:
    if: ${{ inputs.only == 'trailer' }}
    name: Trailer voice lines with Chatterbox (English and Spanish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper
      - name: Speak the twelve trailer lines
        run: |
          mkdir -p clips
          python video/chatterbox_say.py video/trailer/voice-lines.json clips/wer-table.md
      - name: The voice check, line by line
        if: always()
        run: |
          echo "### Voice check (faster-whisper listens to every line)" >> "$GITHUB_STEP_SUMMARY"
          cat clips/wer-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-voice-chatterbox
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  storyboard_v10:
    # Storyboard v10 (owner, 2026-11-03): real-app captures (copper cathodes, South Africa, CIF) through the app's own
    # screens by throwaway members (removed again afterwards), then the key frames and the table. No voice, no video.
    if: ${{ inputs.only == 'storyboard-v10' }}
    name: Storyboard v10 (stills only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-live-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture the real app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/serve.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/index.html >/dev/null && break; sleep 1; done
          node video/storyboard10/capture.js capture
      - run: node video/storyboard10/make.js capture storyboard-v10
      - run: cat storyboard-v10/storyboard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storyboard-v10
          path: |
            storyboard-v10/
            capture/
          retention-days: 14
          if-no-files-found: warn

  storyboard_v10_rebuild:
    # Rebuilds storyboard v10 from the captures of an earlier run (no live database, no new captures).
    if: ${{ inputs.only == 'storyboard-v10-rebuild' }}
    name: Storyboard v10 (rebuild from captures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: storyboard-v10
          path: prev
          run-id: '41640528799'
          github-token: ${{ github.token }}
      - run: node video/storyboard10/make.js prev/capture storyboard-v10-final
      - run: cat storyboard-v10-final/storyboard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: storyboard-v10-final
          path: |
            storyboard-v10-final/
            prev/capture/
          retention-days: 14

