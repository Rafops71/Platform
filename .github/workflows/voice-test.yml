  trailer_sample_1:
    # Trailer sample, acts 1-2 (about 14 s), no voice, no music file (the owner's licence: mixed elsewhere), drawings only, $0. OpenMontage's Remotion composer at the pinned
    # commit (as the older trailer job) renders video/trailer3/TrailerSample.tsx, which animates the approved storyboard drawings.
    # Serves docs/AGREED-2026-11-01-owner-changes.md.
    if: ${{ inputs.only == 'trailer-sample-1' }}
    name: Trailer sample 1 (acts 1-2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OM_SHA: '195eab24478dc9363326aec437aefc3701635ddf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: OpenMontage composer
        run: |
          mkdir om && cd om && git init -q && git remote add origin https://github.com/calesthio/OpenMontage
          git fetch -q --depth 1 origin "$OM_SHA" && git checkout -q FETCH_HEAD
          cd remotion-composer && npm ci --no-audit --no-fund
          cp ../../video/trailer3/scenes.ts src/components/scenes.ts
          cp ../../video/trailer3/TrailerSample.tsx src/components/TrailerSample.tsx
          mkdir -p public/mp && cp ../../video/trailer3/ship.svg public/mp/ship.svg
          sed -i '1i import { TrailerSample } from "./components/TrailerSample";' src/Root.tsx
          sed -i '0,/^    <\/>$/s//      <Composition id="TrailerSample" component={TrailerSample} durationInFrames={420} fps={30} width={1920} height={1080} \/>\n    <\/>/' src/Root.tsx
          grep -n "TrailerSample" src/Root.tsx
      - name: Render
        run: cd om/remotion-composer && npx remotion render src/index.tsx TrailerSample ../../trailer-sample-1.mp4 --codec h264 --crf 20 --concurrency 4
      - name: Sound effects (generated here, no third-party sound) and mix plan
        run: |
          mkdir -p sfx
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=0.9:c=pink:a=0.6:r=48000" -af "highpass=f=350,lowpass=f=5200,afade=t=in:d=0.3,afade=t=out:st=0.3:d=0.6,aecho=0.6:0.5:60:0.3,volume=23.5dB" -ac 2 sfx/whoosh.wav
          ffmpeg -v error -y -f lavfi -i "anoisesrc=d=0.08:c=white:a=0.8:r=48000" -af "highpass=f=1800,lowpass=f=9000,afade=t=out:st=0.004:d=0.07,volume=3dB" -ac 2 sfx/click.wav
          ffmpeg -v error -y -f lavfi -i "aevalsrc='0.55*sin(2*PI*55*t)+0.3*sin(2*PI*82.5*t)+0.15*sin(2*PI*110*t)':d=3.2:s=48000" -af "lowpass=f=420,afade=t=in:d=0.5,afade=t=out:st=0.9:d=2.3,volume=0dB" -ac 2 sfx/tone-low.wav
          for f in sfx/*.wav; do echo "$f $(ffprobe -v error -show_entries format=duration -of csv=p=0 $f) s"; ffmpeg -i $f -af volumedetect -f null - 2>&1 | grep max_volume || true; done
          cp video/trailer3/cues.json video/trailer3/cues-full-plan.json video/trailer3/SFX-LICENCE.md .
      - name: Check it
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,nb_frames -of default=nw=1 trailer-sample-1.mp4
          ls -l trailer-sample-1.mp4
          for t in 1 3 6 8 9.5 11 12.5 13.8; do ffmpeg -v error -y -ss $t -i trailer-sample-1.mp4 -frames:v 1 -vf scale=960:-1 "frame-$t.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: trailer-sample-1
          path: |
            trailer-sample-1.mp4
            frame-*.png
            sfx/
            cues.json
            cues-full-plan.json
            SFX-LICENCE.md
          retention-days: 14

  trailer_sample_2:
