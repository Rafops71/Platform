          retention-days: 14
          if-no-files-found: warn

  qwen:
    if: ${{ inputs.only == 'all' || inputs.only == 'qwen' }}
    name: Qwen3-TTS 0.6B (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
