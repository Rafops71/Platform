  trailer_full_silent:
    # Full ~90 s trailer, SILENT (no music, no SFX, no voice), drawings and the real app captures only, $0.
    # OpenMontage's Remotion composer at the pinned commit renders video/trailer3/TrailerFull.tsx (the 8 approved acts, time-driven).
    # Serves docs/AGREED-2026-11-01-owner-changes.md.
    if: ${{ inputs.only == 'trailer-full' }}
    name: Full trailer, silent
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OM_SHA: '195eab24478dc9363326aec437aefc3701635ddf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: storyboard-v10-final
          path: prev
          run-id: '41641574804'
          github-token: ${{ github.token }}
      - name: OpenMontage composer
