    # Serves docs/AGREED-2026-11-01-owner-changes.md.
    if: ${{ inputs.only == 'trailer-final' }}
    name: Final trailer (voice, 1080p)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      OM_SHA: '195eab24478dc9363326aec437aefc3701635ddf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install faster-whisper soundfile numpy
      - uses: actions/download-artifact@v4
        with:
          name: storyboard-v10-final
          path: prev
          run-id: '41641574804'
          github-token: ${{ github.token }}
      - name: Voice (Gemini Algieba, listened to by faster-whisper)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 video/trailer3/voice_final.py voice-out
      - name: The voice check
        if: always()
        run: cat voice-out/voice-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-final-voice-raw
          path: |
            voice-out/raw-*.wav
            voice-out/voice-table.md
            voice-out/timings.json
          retention-days: 14
          if-no-files-found: warn
      - name: OpenMontage composer
        run: |
          mkdir om && cd om && git init -q && git remote add origin https://github.com/calesthio/OpenMontage
          git fetch -q --depth 1 origin "$OM_SHA" && git checkout -q FETCH_HEAD
          cd remotion-composer && npm ci --no-audit --no-fund
          cp ../../video/trailer3/scenes.ts ../../video/trailer3/scenesFull.ts ../../video/trailer3/handshakeData.ts ../../video/trailer3/TrailerFull.tsx src/components/
          cp ../../voice-out/timings.json src/components/timings.json
          mkdir -p public/mp && cp ../../video/trailer3/ship.svg public/mp/ship.svg
          cp ../../prev/prev/capture/browse.png ../../prev/prev/capture/row.png ../../prev/prev/capture/contact.png ../../prev/prev/capture/mailbox.png public/mp/
          sed -i '1i import { TrailerFull } from "./components/TrailerFull";' src/Root.tsx
          sed -i '0,/^    <\/>$/s//      <Composition id="TrailerFull" component={TrailerFull} durationInFrames={2700} fps={30} width={1920} height={1080} \/>\n    <\/>/' src/Root.tsx
          grep -n "TrailerFull" src/Root.tsx
      - name: Render (silent picture)
        run: cd om/remotion-composer && npx remotion render src/index.tsx TrailerFull ../../trailer-final-silent.mp4 --codec h264 --crf 20 --concurrency 4
      - name: Put the voice under the picture
        run: |
          ffmpeg -v error -y -i trailer-final-silent.mp4 -i voice-out/voice-track.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -t 90 trailer-final-voice.mp4
          cp voice-out/voice-track.wav voice-out/voice-track.mp3 voice-out/timings.json voice-out/voice-table.md .
      - name: Check it
        run: |
          for f in trailer-final-voice.mp4 trailer-final-silent.mp4; do echo "== $f"; ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,nb_frames -of default=nw=1 $f; ffmpeg -i $f -af volumedetect -vn -f null - 2>&1 | grep -E "mean_volume|max_volume" || true; done
