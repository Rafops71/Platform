name: Voice test (VoxCPM2 and Kokoro)

# Two short test clips from two free, Apache-2.0 voice models, made on GitHub's
# own free runners, for the owner to listen to and pick (owner's list, item 22,
# 2026-11-01). Manual only. No secrets, no live database, nothing committed:
# the clips are uploaded as artifacts and the summary says what ran.
#
# Kokoro is small and very likely runs on a CPU. VoxCPM2's model card names
# CUDA >= 12.0 as a requirement and says nothing about CPU, so that job is
# allowed to fail (continue-on-error) and says plainly what happened.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one job (kokoro, voxcpm, gemini, chatterbox, qwen, trailer) or all'
        default: 'all'

permissions:
  contents: read

jobs:
  kokoro:
    if: ${{ inputs.only == 'all' || inputs.only == 'kokoro' || github.event_name != 'workflow_dispatch' }}
    name: Kokoro-82M (English and Spanish voices)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the system library Kokoro needs
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Install Kokoro (CPU build of PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.2" soundfile
      - name: Make the clips
        run: python video/voice-test/kokoro_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Kokoro-82M" >> "$GITHUB_STEP_SUMMARY"
          cat clips/kokoro-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-kokoro
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  voxcpm:
    if: ${{ inputs.only == 'all' || inputs.only == 'voxcpm' || github.event_name != 'workflow_dispatch' }}
    name: VoxCPM2 (English and Spanish clips, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VoxCPM2 (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm soundfile
      - name: Try to make the clips
        run: python video/voice-test/voxcpm_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### VoxCPM2" >> "$GITHUB_STEP_SUMMARY"
          cat clips/voxcpm-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-voxcpm
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  gemini:
    if: ${{ inputs.only == 'all' || inputs.only == 'gemini' || github.event_name != 'workflow_dispatch' }}
    name: Gemini Algieba (the same two lines, for comparison; may fail on the free daily limit)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make the two lines with the film voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p clips
          python3 - <<'PY'
          import json, subprocess
          g = json.load(open('video/script.json'))['voice']['gemini']
          lines = {
            'en': 'A private market for physical commodities. By invitation only.',
            'es': 'Un mercado privado de materias primas físicas. Solo por invitación.',
          }
          for lang, text in lines.items():
              r = subprocess.run(['python3', 'video/gemini_say.py', g['model'], g['voice'], g['style'][lang], f'clips/gemini-{lang}.wav'],
                                 input=text, text=True, capture_output=True)
              print(lang, 'ok' if r.returncode == 0 else 'FAILED: ' + (r.stderr or '')[-200:])
          PY
      - name: Say what happened
        if: always()
        run: |
          echo "### Gemini (Algieba)" >> "$GITHUB_STEP_SUMMARY"
          ls -l clips >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-gemini
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  chatterbox:
    if: ${{ inputs.only == 'all' || inputs.only == 'chatterbox' || github.event_name != 'workflow_dispatch' }}
    name: Chatterbox-Multilingual (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Try to make the clips
        run: python video/voice-test/chatterbox_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Chatterbox" >> "$GITHUB_STEP_SUMMARY"
          cat clips/chatterbox-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-chatterbox
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  qwen:
    if: ${{ inputs.only == 'all' || inputs.only == 'qwen' }}
    name: Qwen3-TTS 0.6B (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qwen3-TTS (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -U qwen-tts soundfile
      - name: Try to make the clips
        run: python video/voice-test/qwen_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Qwen3-TTS" >> "$GITHUB_STEP_SUMMARY"
          cat clips/qwen-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-qwen
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  trailer:
    if: ${{ inputs.only == 'trailer' }}
    name: Trailer voice lines with Chatterbox (English and Spanish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts faster-whisper
      - name: Speak the twelve trailer lines
        run: |
          mkdir -p clips
          python video/chatterbox_say.py video/trailer/voice-lines.json clips/wer-table.md
      - name: The voice check, line by line
        if: always()
        run: |
          echo "### Voice check (faster-whisper listens to every line)" >> "$GITHUB_STEP_SUMMARY"
          cat clips/wer-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-voice-chatterbox
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  trailer_voice_en:
    # The new English trailer's narration (owner's approved text, 2026-11-02): Gemini Algieba, two requests, slowed
    # (atempo 0.93), listened to by faster-whisper. Run once; the build reuses its artifact.
    if: ${{ inputs.only == 'trailer-voice-en' }}
    name: New English trailer voice (Gemini, 2 requests, gated)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install faster-whisper soundfile numpy
      - name: Speak, slow, listen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 video/trailer2/voice.py voice-out
      - name: The voice check
        if: always()
        run: cat voice-out/voice-table.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-voice-en
          path: |
            voice-out/voice-*.wav
            voice-out/voice-*.json
            voice-out/voice-table.md
          retention-days: 14
          if-no-files-found: warn

  trailer_capture:
    # Sharp pictures of the real app (Browse with real listings posted through the app's own form) for the new
    # English trailer. Uses the live project like the films do, so it holds the same place in the queue as CI.
    if: ${{ inputs.only == 'trailer-capture' }}
    name: New English trailer pictures (the real app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-live-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/serve.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/index.html >/dev/null && break; sleep 1; done
          node video/trailer2/capture.js capture-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trailer-capture-en
          path: capture-out/
          retention-days: 14
          if-no-files-found: warn

  trailer_render_en:
    # Renders the new English trailer on the runner (OpenMontage's Remotion composer + the app-coloured scenes of
    # video/trailer2/MyPlatformScenes.tsx), checks it, uploads it; with only=trailer-send-en it also emails it once.
    if: ${{ inputs.only == 'trailer-render-en' || inputs.only == 'trailer-send-en' }}
    name: New English trailer, render (and send)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VOICE_RUN: '41441771944'
      CAPTURE_RUN: '41442771453'
      OM_SHA: '195eab24478dc9363326aec437aefc3701635ddf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install numpy soundfile pillow
      - uses: actions/download-artifact@v4
        with:
          name: trailer-voice-en
          run-id: ${{ env.VOICE_RUN }}
          github-token: ${{ github.token }}
          path: voice
      - uses: actions/download-artifact@v4
        with:
          name: trailer-capture-en
          run-id: ${{ env.CAPTURE_RUN }}
          github-token: ${{ github.token }}
          path: capture
      - name: Cut list and narration
        run: python3 video/trailer2/build.py voice build capture
      - name: OpenMontage (the composer the first trailer was made with)
        run: |
          mkdir om && cd om && git init -q && git remote add origin https://github.com/calesthio/OpenMontage
          git fetch -q --depth 1 origin "$OM_SHA" && git checkout -q FETCH_HEAD
          cd remotion-composer && npm ci --no-audit --no-fund
          cp ../../video/trailer2/MyPlatformScenes.tsx src/components/MyPlatformScenes.tsx
          git apply ../../video/trailer/explainer.patch
          mkdir -p public/mp
          cp ../../build/narration.wav public/mp/narration-en-new.wav
          cp ../../build/trailer-en.json public/mp/trailer-en-new.json
          cp ../../build/listing-0.png ../../build/listing-1.png ../../build/browse-top.png public/mp/
      - name: Render
        run: cd om/remotion-composer && npx remotion render src/index.tsx Explainer ../../trailer-en.mp4 --props=public/mp/trailer-en-new.json --codec h264 --crf 22 --concurrency 4
      - name: Check it (length, picture, sound)
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,nb_frames -of default=nw=1 trailer-en.mp4
          ffmpeg -i trailer-en.mp4 -af volumedetect -vn -f null - 2>&1 | grep -E "mean_volume|max_volume"
          ls -l trailer-en.mp4
          for t in 3 12 28 36 44 55 66 76; do ffmpeg -v error -y -ss $t -i trailer-en.mp4 -frames:v 1 -vf scale=960:-1 "frame-$t.png"; done
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 trailer-en.mp4)
          for b in 7 4 1; do ffmpeg -v error -y -ss $(python3 -c "print(max(0,$D-$b))") -i trailer-en.mp4 -frames:v 1 -vf scale=960:-1 "frame-end$b.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: trailer-en-render
          path: |
            trailer-en.mp4
            frame-*.png
            build/timeline.md
            voice/voice-table.md
          retention-days: 14
      - name: Send (only with only=trailer-send-en)
        if: ${{ inputs.only == 'trailer-send-en' }}
        run: |
          ffmpeg -v error -y -i trailer-en.mp4 -vf scale=1280:-2 -c:v libx264 -crf 24 -preset medium -c:a aac -b:a 96k -movflags +faststart small.mp4
          ls -l small.mp4
          node scripts/send-trailer.js small.mp4
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LISTING_EMAIL_FROM: ${{ secrets.LISTING_EMAIL_FROM }}
