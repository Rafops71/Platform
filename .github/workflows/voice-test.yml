          python-version: '3.11'
      - name: Install Chatterbox (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts
      - name: Try to make the clips
        run: python video/voice-test/chatterbox_clips.py
