name: Voice test (VoxCPM2 and Kokoro)

# Two short test clips from two free, Apache-2.0 voice models, made on GitHub's
# own free runners, for the owner to listen to and pick (owner's list, item 22,
# 2026-11-01). Manual only. No secrets, no live database, nothing committed:
# the clips are uploaded as artifacts and the summary says what ran.
#
# Kokoro is small and very likely runs on a CPU. VoxCPM2's model card names
# CUDA >= 12.0 as a requirement and says nothing about CPU, so that job is
# allowed to fail (continue-on-error) and says plainly what happened.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only one job (kokoro, voxcpm, gemini, chatterbox, qwen, trailer) or all'
        default: 'all'

permissions:
  contents: read

jobs:
  kokoro:
    if: ${{ inputs.only == 'all' || inputs.only == 'kokoro' || github.event_name != 'workflow_dispatch' }}
    name: Kokoro-82M (English and Spanish voices)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the system library Kokoro needs
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Install Kokoro (CPU build of PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.2" soundfile
      - name: Make the clips
        run: python video/voice-test/kokoro_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### Kokoro-82M" >> "$GITHUB_STEP_SUMMARY"
          cat clips/kokoro-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-kokoro
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  voxcpm:
    if: ${{ inputs.only == 'all' || inputs.only == 'voxcpm' || github.event_name != 'workflow_dispatch' }}
    name: VoxCPM2 (English and Spanish clips, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install VoxCPM2 (CPU build of PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm soundfile
      - name: Try to make the clips
        run: python video/voice-test/voxcpm_clips.py
      - name: Say what happened
        if: always()
        run: |
          echo "### VoxCPM2" >> "$GITHUB_STEP_SUMMARY"
          cat clips/voxcpm-summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "The script did not get as far as writing a summary." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-voxcpm
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  gemini:
    if: ${{ inputs.only == 'all' || inputs.only == 'gemini' || github.event_name != 'workflow_dispatch' }}
    name: Gemini Algieba (the same two lines, for comparison; may fail on the free daily limit)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make the two lines with the film voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p clips
          python3 - <<'PY'
          import json, subprocess
          g = json.load(open('video/script.json'))['voice']['gemini']
          lines = {
            'en': 'A private market for physical commodities. By invitation only.',
            'es': 'Un mercado privado de materias primas físicas. Solo por invitación.',
          }
          for lang, text in lines.items():
              r = subprocess.run(['python3', 'video/gemini_say.py', g['model'], g['voice'], g['style'][lang], f'clips/gemini-{lang}.wav'],
                                 input=text, text=True, capture_output=True)
              print(lang, 'ok' if r.returncode == 0 else 'FAILED: ' + (r.stderr or '')[-200:])
          PY
      - name: Say what happened
        if: always()
        run: |
          echo "### Gemini (Algieba)" >> "$GITHUB_STEP_SUMMARY"
          ls -l clips >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No clips were made." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-test-gemini
          path: clips/
          retention-days: 14
          if-no-files-found: warn

  chatterbox:
    if: ${{ inputs.only == 'all' || inputs.only == 'chatterbox' || github.event_name != 'workflow_dispatch' }}
    name: Chatterbox-Multilingual (English and Spanish, CPU, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
