name: Send the films
# Branch notify-owner: sends the owner a text-only confirmation (no films). Manual only.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/send-films.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LISTING_EMAIL_FROM: ${{ secrets.LISTING_EMAIL_FROM }}
