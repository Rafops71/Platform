<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jericho Platform — Register</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-shell">
  <div id="lang-toggle" class="lang-toggle lang-toggle-auth"></div>

  <div class="logo-row">
    <h1>Jericho Platform</h1>
    <p data-i18n="register.title">Complete your registration</p>
  </div>

  <div id="invitation-checking" class="card text-center text-muted" data-i18n="register.checking">Checking invitation link…</div>

  <div id="invitation-invalid" class="card hidden">
    <p><strong data-i18n="register.invalid">This invitation link is invalid, expired, or already used.</strong></p>
    <p class="text-muted" data-i18n="register.invalidHelp">Ask an Operator to send you a new invitation link.</p>
  </div>

  <div id="register-card" class="card hidden">
    <form id="register-form">
      <div class="grid-2">
        <div>
          <label for="first_name"><span data-i18n="register.firstName">First name</span> *</label>
          <input type="text" id="first_name" required>
        </div>
        <div>
          <label for="last_name"><span data-i18n="register.lastName">Last name</span> *</label>
          <input type="text" id="last_name" required>
        </div>
      </div>

      <label for="company" data-i18n="register.company">Company (optional)</label>
      <input type="text" id="company">

      <label for="email"><span data-i18n="common.email">Email</span> *</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password"><span data-i18n="common.password">Password</span> *</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <div class="field-hint" data-i18n="register.passwordHint">At least 6 characters.</div>

      <div class="grid-2">
        <div>
          <label for="country"><span data-i18n="register.country">Country</span> *</label>
          <select id="country" required>
            <option value="" data-i18n="register.countryPlaceholder">Select a country…</option>
          </select>
        </div>
        <div>
          <label for="phone"><span data-i18n="register.phone">Phone number</span> *</label>
          <input type="tel" id="phone" required>
        </div>
      </div>

      <!-- Required. The `required` attribute blocks submission in the browser;
           handleRegisterSubmit checks it again, and sql/010 records what was
           accepted so the consent is provable afterwards. -->
      <div class="terms-accept">
        <label for="accept-terms" class="checkbox-row">
          <input type="checkbox" id="accept-terms" required>
          <span>
            <span data-i18n="register.terms.accept">I have read and accept the</span>
            <a href="terms.html" target="_blank" rel="noopener" id="terms-link" data-i18n="register.terms.link">Terms &amp; Conditions</a><span data-i18n="register.terms.suffix">.</span>
          </span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;" id="register-btn" data-i18n="register.submit">Register</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
