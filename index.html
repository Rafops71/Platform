<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jericho Platform — Sign In</title>
<!-- "Sky Tint" (docs/LOOK-DECISION.md): Spectral for headings and listing
     titles, Source Sans 3 for everything read as information. display=swap so
     a slow or blocked Google Fonts shows Georgia and the system sans rather
     than nothing - the page must never wait on a font to be readable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="auth-shell">
  <div id="lang-toggle" class="lang-toggle lang-toggle-auth"></div>

  <div class="logo-row">
    <h1>Jericho Platform</h1>
    <p data-i18n="login.tagline">Private, invitation-only. Sign in to continue.</p>
  </div>

  <div id="notice" class="card hidden"></div>

  <div class="card">
    <form id="login-form">
      <label for="email" data-i18n="common.email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password" data-i18n="common.password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:18px;" id="login-btn" data-i18n="login.submit">Sign In</button>
    </form>

    <!-- Forgetting a password is ordinary, and before this there was no way
         back at all: no link, no flow, and an Operator with no second Operator
         to ask. The link opens a panel on this same page rather than a
         separate screen, so nobody loses their place. -->
    <p class="text-center" style="font-size:var(--text-base); margin-top:14px; margin-bottom:0;">
      <a href="#" id="forgot-link" data-i18n="reset.forgot">Forgotten your password?</a>
    </p>

    <div id="forgot-panel" class="hidden" style="margin-top:16px; border-top:1px solid var(--line); padding-top:16px;">
      <form id="forgot-form">
        <label for="forgot-email" data-i18n="reset.emailLabel">Your email address</label>
        <input type="email" id="forgot-email" required autocomplete="username">
        <p class="list-row-meta" style="margin:8px 0 0;" data-i18n="reset.explain">
          We will send a link that lets you set a new password. The link expires, and can be used once.
        </p>
        <div class="row" style="margin-top:12px; gap:8px;">
          <button type="submit" class="btn btn-primary btn-small" id="forgot-send-btn" data-i18n="reset.send">Send the link</button>
          <button type="button" class="btn btn-secondary btn-small" id="forgot-cancel-btn" data-i18n="common.cancel">Cancel</button>
        </div>
      </form>
      <p id="forgot-done" class="hidden list-row-meta" style="margin-top:12px;"></p>
    </div>
  </div>

  <p class="text-center text-muted" style="font-size:var(--text-base);" data-i18n="login.noAccount">
    No account? Access is by invitation only — ask an Operator for an invitation link.
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/signing.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
